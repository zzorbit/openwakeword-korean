<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실행 모델 선택</title><link rel="stylesheet" href="analysis.css"><script src="analysis.js" defer></script></head>
<body><main>
<header><h1>실행 모델 선택</h1><p>평가 결과를 비교하고 마이크로 시험할 모델을 고르세요.</p></header>
<p id="error" class="notice" role="alert" hidden></p>
<section><h2 id="title">모델을 불러오는 중</h2><p id="active" class="hint"></p>
<p id="original-runtime" class="hint"></p>
<div class="scroll"><table><thead><tr><th>모델</th><th>조용할 때</th><th>소음 평균</th><th>시간당 오작동</th><th>목표 충족</th></tr></thead><tbody id="models"></tbody></table></div>
<div class="controls"><label>시험할 모델<select id="candidate"></select></label><button id="select" class="primary" disabled>이 모델로 시험</button></div>
<p class="hint">위 표의 평가 설정으로 별도 실행 묶음을 저장합니다. 기존 모델·평가 결과는 그대로 보존합니다.</p></section>
<section><h2>감지 민감도 비교</h2><p class="hint">감지 기준을 낮추면 호출을 더 잘 찾을 수 있지만 오작동이 늘 수 있습니다. 기존 점수를 재사용하며 새로 학습하지 않습니다.</p>
<div class="controls"><label>감지 기준<input id="thresholds" placeholder="0과 1 사이 · 쉼표로 최대 7개" autocomplete="off"></label><label>연속 감지 수<input id="consecutive" placeholder="1~10 · 쉼표로 최대 3개" autocomplete="off"></label><button id="compare" disabled>민감도 비교</button></div>
<p id="job" role="status" aria-live="polite"></p>
<div id="comparison" hidden><div class="scroll"><table><thead><tr><th>선택</th><th>감지 기준</th><th>연속 감지</th><th>조용할 때</th><th>소음 평균</th><th>시간당 오작동</th><th>목표 충족</th></tr></thead><tbody id="comparisons"></tbody></table></div><button id="select-setting" class="primary" disabled>선택한 설정으로 시험</button></div>
</section>
<section id="saved" hidden><h2>시험할 모델을 저장했습니다</h2><p id="saved-model"></p><p id="saved-performance" class="hint"></p><a id="microphone" target="_blank" rel="noopener">마이크 시험 열기 ↗</a><a id="download">실행 모델 내려받기</a><details><summary>저장 위치</summary><code id="directory"></code></details></section>
</main></body></html>
