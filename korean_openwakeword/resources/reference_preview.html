<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기준 목소리 검수</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#171a1f;color:#e3e7ec}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{padding:16px;font-size:16px;line-height:24px}
main{width:min(640px,100%);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center}

.reference-startup{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:14px;line-height:22px}

button{height:44px;width:96px;padding:8px 12px;cursor:pointer;font-weight:500}

<link rel="stylesheet" href="/audio_listening.css">
<style>

.reference-listening-view{display:contents}
.candidate-panel[hidden],.candidate-actions[hidden]{display:none}

.candidate-head-tools{display:flex;align-items:center;gap:14px;flex:none}

.candidate-volume .listen-mute svg{width:22px;height:22px}

@media(max-width:480px){html.reference-candidates .reference-group-head{flex-wrap:wrap}.candidate-head-tools{gap:7px;margin-left:auto}.candidate-volume{gap:2px}.candidate-volume .listen-volume{width:56px}.candidate-volume .listen-mute{width:26px;height:26px;min-height:26px}}
html.reference-candidates,html.reference-candidates body{height:auto;min-height:0;overflow:visible}
html.reference-candidates main.listen-preview{width:min(820px,100%);height:auto;min-height:0;justify-content:center;overflow:visible}
html.reference-candidates .listen-workspace{width:100%;max-width:820px}
html.reference-candidates .listen-player{gap:8px}
.candidate-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
.candidate-row{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border:1px solid #36404d;border-radius:10px;background:#20262e;color:#e9edf2}
.candidate-row[data-playing="true"]{background:#354a63;border-color:#8ba8c8}

.candidate-row .candidate-play{display:flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;min-height:28px;padding:0;border:1px solid #d2d7de;border-radius:50%;font-size:0;background:#c5cbd3;color:#20252d}

.candidate-play::before{content:"";display:block;width:0;height:0;margin-left:2px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent currentColor}

.candidate-number{font-size:14px;font-variant-numeric:tabular-nums}

.candidate-settings{display:flex;flex-wrap:wrap;gap:0 10px;color:#b3bdca;font-size:12px;line-height:18px;overflow-wrap:anywhere}
.candidate-setting{min-width:0}
.candidate-card{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-areas:"info info" "play choice";grid-template-rows:1fr auto;gap:12px 6px;align-items:start;padding:8px 7px;border-radius:12px}
.candidate-card .candidate-info{grid-area:info;align-self:stretch}
.candidate-card .candidate-heading{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:9px;line-height:18px}

.candidate-card .candidate-seed{font-size:11px;line-height:16px;white-space:normal;overflow-wrap:anywhere}
.candidate-card .candidate-settings{display:grid;gap:5px;font-size:12px;line-height:17px}
.candidate-card .candidate-play{grid-area:play;width:30px;height:30px;min-height:30px;align-self:center}
.candidate-card .candidate-choice{grid-area:choice;align-self:center;justify-self:end;gap:5px;font-size:12px}
.candidate-card .candidate-choice span{max-width:3em;line-height:14px}
.candidate-heard{color:#fff;font-size:14px;line-height:20px}
.candidate-choice{display:flex;align-items:center;gap:6px;flex:none;cursor:pointer;font-size:13px;line-height:20px}
.candidate-choice input{width:17px;height:17px;margin:0;accent-color:#91a8c4;cursor:pointer}
.candidate-choice input:disabled{cursor:default}.candidate-choice:has(input:disabled){opacity:.55;cursor:default}
.candidate-choice input:focus-visible{outline:2px solid #a8afb7;outline-offset:3px}
.candidate-actions:not([hidden]){display:flex;justify-content:center}
.candidate-actions button{width:auto;min-height:36px;height:36px;padding:5px 14px;font-size:14px;line-height:24px}
.candidate-actions button:disabled{opacity:1;color:#a5b0bd}
.candidate-deck{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:8px;align-items:stretch}
.candidate-deck[hidden]{display:none}
.candidate-panel[aria-busy="true"]:not([hidden]){display:flex;flex-direction:column;justify-content:center;min-height:var(--candidate-work-height,232px)}
.candidate-panel[aria-busy="true"] .candidate-empty{padding:0}
.candidate-add:not([hidden]){display:flex;align-items:stretch;justify-content:stretch}
.candidate-add :is(#candidate-more,#candidate-previous){display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:44px;padding:0;border:1px dashed #536171;border-radius:12px;background:transparent;color:#c9d3df}
.candidate-add :is(#candidate-more,#candidate-previous):hover:not(:disabled){background:#2b3542;border-color:#9aacc2}
.candidate-add :is(#candidate-more,#candidate-previous):disabled{color:#738192;border-color:#3d4856;cursor:default}
.candidate-add :is(#candidate-more,#candidate-previous)[hidden]{display:none}
.candidate-add #candidate-previous{font-size:28px;font-weight:300;line-height:1}
.candidate-add #candidate-more-label{font-size:28px;font-weight:300;line-height:1}
.candidate-add #candidate-more:focus-visible{outline:2px solid #bac5d6;outline-offset:2px}
@media(max-width:480px){.candidate-deck{grid-template-columns:34px minmax(0,1fr) 34px;gap:6px}}
.candidate-job-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-right:7px;vertical-align:-2px;color:#fff}
.candidate-job-icon[data-state="running"]::before{content:"";display:inline-block;box-sizing:border-box;width:12px;height:12px;flex:none;border:2px solid #70c981;border-right-color:transparent;border-radius:50%;animation:candidate-spin 3s linear infinite}
.candidate-job-icon[data-state="complete"]::before{content:"✓";font-size:16px;line-height:16px}
.candidate-job-icon:not([data-state]){display:none}
.candidate-progress-slot{height:9px;padding-top:6px;flex:none}
.candidate-progress-slot[hidden]{display:none}
.candidate-progress{height:3px;border-radius:3px;overflow:hidden;background:#29343c}
.candidate-progress[hidden]{display:none}.candidate-progress span{display:block;height:100%;width:0;background:#58ae82;transition:width .2s ease}
.candidate-progress[data-indeterminate="true"] span{transition:none;animation:candidate-progress-wait 3s ease-in-out infinite alternate}
@keyframes candidate-progress-wait{from{transform:translateX(0)}to{transform:translateX(300%)}}
.candidate-empty{padding:12px 0;text-align:center;font-size:14px;line-height:22px}
.candidate-empty .candidate-job-icon{margin:0 0 0 7px;vertical-align:-2px}
.candidate-empty .candidate-job-icon[hidden]{display:none}
html.reference-candidates .reference-group-nav{justify-content:space-between;flex-wrap:nowrap}
html.reference-candidates .reference-group-nav button{height:34px;min-height:34px;padding:4px 12px;font-size:14px}
html.reference-candidates .reference-group-head p{white-space:nowrap}
@keyframes candidate-spin{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){.candidate-job-icon[data-state="running"]::before{animation:none}.candidate-progress span{transition:none}.candidate-progress[data-indeterminate="true"] span{animation:none}}
@media(max-width:400px){.candidate-row{gap:7px;padding-inline:7px}.candidate-actions button{padding-inline:10px}.candidate-number{font-size:13px}}
@media(max-width:679px){.candidate-list{grid-template-columns:repeat(2,minmax(0,1fr))}.candidate-card{padding:9px 10px}.candidate-card .candidate-settings{gap:4px}}
@media(max-width:400px){.candidate-list{grid-template-columns:minmax(0,1fr)}.candidate-card{grid-template-columns:34px minmax(0,1fr);padding:10px}.candidate-card .candidate-settings{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}.candidate-card .candidate-number{font-size:14px}}
</style>
<main class="listen-preview">
  <div id="reference-startup" class="reference-startup" role="status" aria-busy="true"><p id="reference-startup-status">목소리 목록을 불러오고 있습니다...</p><button id="reference-startup-retry" type="button" hidden>다시 시도</button></div>

  <div class="listen-player">
  <div id="reference-group-head" class="reference-group-head" hidden><div class="candidate-group-title"><strong id="reference-group-name"></strong><p id="reference-group-count"></p></div><div class="candidate-head-tools"><div id="candidate-volume" class="candidate-volume" role="group" aria-label="음량 조절" hidden></div></div></div>
  <section id="candidate-panel" class="candidate-panel" aria-label="기준 목소리 후보" hidden>

    <div id="candidate-list" class="candidate-list"></div>
    <div id="candidate-actions" class="candidate-actions candidate-add" hidden><button id="candidate-more" type="button" aria-label="기준 목소리 후보 더 뽑기" title="기준 목소리 후보 5개 더 생성" disabled><span id="candidate-more-label" aria-hidden="true">+</span></button></div>
    </div>
    <p id="candidate-empty" class="candidate-empty" role="status" hidden><span id="candidate-status-label"></span><span id="candidate-job-icon" class="candidate-job-icon" aria-hidden="true" hidden></span></p>
    <div id="candidate-progress-slot" class="candidate-progress-slot" hidden><div id="candidate-progress" class="candidate-progress" role="progressbar" aria-label="기준 목소리 후보 생성" aria-valuemin="0" aria-valuemax="5" hidden><span id="candidate-progress-fill"></span></div></div>

  </div>
  </div>
</main>
<!-- List playback remains available for whole-corpus listening and existing projects.
     Its controls are inert until a validated list-view response needs them. -->
<template id="reference-listening-template">
  <div class="reference-listening-view">
  <div id="reference-voices" class="reference-voices" role="group" aria-label="이 묶음의 기준 목소리 번호" hidden></div>
  <div class="listen-heading"><select id="voice" class="listen-select" aria-label="들을 목소리" disabled hidden></select><div id="voice-picker" class="voice-picker" hidden><button id="voice-picker-button" class="voice-picker-button" type="button" aria-label="들을 목소리" aria-haspopup="listbox" aria-expanded="false" aria-controls="voice-picker-list" disabled><span id="voice-picker-label" class="voice-picker-label"></span></button><div id="voice-picker-popup" class="voice-picker-popup" hidden><div id="voice-picker-list" class="voice-picker-list" role="listbox" aria-label="들을 목소리" tabindex="-1" hidden></div></div></div><p id="position" class="listen-position" aria-live="polite"></p></div>
  <div id="reference-playback" class="listen-playback"><div class="controls listen-controls"><button id="continuous" type="button" aria-pressed="false" disabled>재생</button></div></div>
  <div id="reference-group-actions" class="listen-decisions reference-decisions" role="group" aria-label="이 묶음의 검수 도구" hidden>
    <button id="reference-replay" type="button" disabled>처음부터 듣기</button>
    <button id="reference-replace" type="button" aria-pressed="false" title="요청한 성별이나 연령대와 다르거나 다른 목소리와 비슷할 때 표시하세요." disabled>교체 대상 표시</button>
    <button id="reference-regenerate" type="button" disabled>선택한 목소리 다시 만들기</button>
  </div>
  <nav id="listen-page" class="listen-page" aria-label="음원 목록 페이지" hidden>
    <button id="listen-page-back" type="button" aria-label="이전 목록 페이지">‹</button>
    <input id="listen-page-number" type="number" min="1" aria-label="목록 페이지 번호">
    <span id="listen-page-total"></span>
    <button id="listen-page-forward" type="button" aria-label="다음 목록 페이지">›</button>
  </nav>
  </div>
</template>

window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent)return;
  if(event.data?.type==='koww:reference-status'&&event.data.project===project){
    if(candidateSelectionBlocked)recoverCandidateSelection();
    if(candidateMode)syncCandidates(true);
    scheduleCandidateHeight(true);
    if(typeof reportedComplete==='boolean')window.parent.postMessage?.({type:'koww:reference-review',project,complete:reportedComplete},location.origin);
  }else if(event.data?.type==='koww:reference-approve'&&event.data.project===project&&candidateMode){
    const group=groups[groupIndex];
    const request=event.data.request;
    const acknowledge=saved=>{
      if(Number.isSafeInteger(request)&&request>0)window.parent.postMessage?.({type:'koww:reference-approved',project,
        group:event.data.group,request,success:saved===true,complete:saved===true&&reportedComplete===true},location.origin);
    };
    if(group&&event.data.group===group.key&&candidateReady)void saveReview('approve',{group:group.key}).then(acknowledge);
    else acknowledge(false);
  }else if(event.data?.type==='koww:voice-picker-ready'&&Number.isSafeInteger(event.data.request)&&event.data.request>0)voicePicker?.reveal(event.data.request);

  if(url.origin!==location.origin||!['http:','https:'].includes(url.protocol))throw Error('음원 경로가 올바르지 않습니다.');

function updatePage(){

const designOrder=['gender','timbre','age_group','style','vocal_effort','speed','intonation'];
function sortReferences(rows){
  const compareAxis=(a,b,axis)=>{
    const left=a.voice_design?.[axis]?.value,right=b.voice_design?.[axis]?.value;
    if(left===right)return 0;
    if(!left)return 1;
    if(!right)return -1;
    return left.localeCompare(right,'en');
  };
  return rows.sort((a,b)=>{
    const leftGroup=a.group||'',rightGroup=b.group||'';
    if(leftGroup!==rightGroup)return leftGroup==='학습용'?-1:rightGroup==='학습용'?1:leftGroup.localeCompare(rightGroup,'ko');
    for(const axis of designOrder){const order=compareAxis(a,b,axis);if(order)return order;}
    return (a.voice_number||0)-(b.voice_number||0);
  });
}
function parseItems(rows){
  if(!Array.isArray(rows))throw Error('음원 목록이 올바르지 않습니다.');
  return rows.map(item=>{
    if(!item||typeof item.text!=='string'||typeof item.id!=='string')throw Error('음원 목록이 올바르지 않습니다.');

}
function heard(item){return item.heard===true||((candidateMode||!editable)&&sessionHeard.has(`${item.id}:${item.sha256}`));}

// Saving an individual selection does not take over the candidate controls.

function playedWholeClip(){
  const ranges=audio.played, tolerance=0.05;
  if(!Number.isFinite(audio.duration)||!ranges?.length)return false;
  let covered=0;
  for(let i=0;i<ranges.length;i++){
    if(ranges.start(i)>covered+tolerance)return false;
    covered=Math.max(covered,ranges.end(i));
  }
  return covered>=audio.duration-tolerance;
}

let reviewRows=[];

function applyReview(payload, nextKey){

  if(payload.mode==='candidate_pool_v2'){applyCandidates(payload);return;}
  const rows=sortReferences(parseItems(payload.items));
  if(!Array.isArray(payload.groups)||!payload.groups.length||typeof payload.editable!=='boolean'||typeof payload.review_complete!=='boolean'){
    throw Error('기준 목소리 검수 정보를 불러오지 못했습니다.');
  }
  const keys=new Set(payload.groups.map(group=>group.key));
  if(keys.size!==payload.groups.length||rows.some(item=>!keys.has(item.group_key)||!item.sha256)||
    payload.groups.some(group=>typeof group.key!=='string'||typeof group.label!=='string'||typeof group.approved!=='boolean'||
      !rows.some(item=>item.group_key===group.key))){
    throw Error('기준 목소리 묶음 정보가 올바르지 않습니다.');
  }
  const previousKey=groups[groupIndex]?.key;
  mountListeningView();
  if(regenerationRunning()&&!payload.job)regeneratedGroup=job.group;
  groups=payload.groups;editable=payload.editable;job=payload.job;reviewRows=rows;
  const activeKey=nextKey||previousKey||job?.group||(editable?groups.find(group=>!group.approved)?.key:undefined);
  const index=Math.max(0,groups.findIndex(group=>group.key===activeKey));
  const activeRows=rows.filter(item=>item.group_key===groups[index].key);
  if(previousKey===groups[index].key&&activeRows.length===items.length&&
    activeRows.every((item,i)=>item.id===items[i].id&&item.sha256===items[i].sha256&&item.audio===items[i].audio)){
    groupIndex=index;

  }else showGroup(index);

  for(const control of [groupHead,groupVoices,groupActions,groupNav])control.hidden=false;
  if(reportedComplete!==payload.review_complete&&window.parent!==window){

      if(candidateMode&&version!==candidateLoadVersion)return;
      errorMessage.textContent=error.message;
      if(candidateMode&&++candidatePollFailures>=3){candidatePollPaused=true;syncCandidates();}
      else scheduleReviewPoll();
    }
  },1200);
}
function recordCandidateHearing(item){
  const key=`${item.id}:${item.sha256}`,scope=candidateSelectionScope();
  if(candidateHearWrites.has(key))return;
  const url=candidateBatchUrl(config.save_url);
  const write=(async()=>{
    try{
      const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Koww-Token':config.token},
        signal:globalThis.AbortSignal?.timeout?.(15000),body:JSON.stringify({action:'hear',id:item.id,sha256:item.sha256})});
      const payload=await response.json();
      if(!response.ok)throw Error(payload.error||'청취 기록을 저장하지 못했습니다.');
      // Only acknowledge the heard clip. A full snapshot can contain an older selection.
      sessionHeard.add(key);
    }catch(error){
      if(candidateMode&&editable&&scope===candidateSelectionScope()&&!errorMessage.textContent)
        errorMessage.textContent=error.message||'청취 기록을 저장하지 못했습니다.';
    }
  })().finally(()=>candidateHearWrites.delete(key));
  candidateHearWrites.set(key,write);
}
async function saveReview(action,fields,nextKey){
  if(saving||regenerationRunning()||candidateMode&&(candidateSelectionWriter||candidateSelectionBlocked))return false;
  candidateSaveAction=candidateMode?action:null;
  if(candidateSaveAction)errorMessage.textContent='';
  saving=true;
  if(candidateSaveAction==='approve')stop();else syncReview();
  if(candidateMode)candidateLoadVersion++;
  try{
    if(candidateMode&&candidateHearWrites.size)await Promise.all(candidateHearWrites.values());
    const saveUrl=candidateMode&&action==='toggle'?candidateBatchUrl(config.save_url):config.save_url;
    const response=await fetch(saveUrl,{method:'POST',headers:{'Content-Type':'application/json','X-Koww-Token':config.token},
      body:JSON.stringify({action,...fields})});
    const payload=await response.json();
    if(!response.ok)throw Error(payload.error||'검수 상태를 저장하지 못했습니다.');
    errorMessage.textContent='';applyReview(payload,nextKey);
    return true;
  }catch(error){stop();errorMessage.textContent=error.message;return false;}
  finally{
    candidateSaveAction=null;
    saving=false;
    // Start the next group's first batch before revealing any empty controls.
    if(!requestInitialCandidates())syncReview();
  }
}
groupBack.addEventListener('click',()=>{if(!groupBack.disabled)showGroup(groupIndex-1);});
groupNext.addEventListener('click',()=>{
  if(candidateMode?!candidateReady:groupNext.disabled)return;
  const group=groups[groupIndex];
  if(candidateMode)return saveReview('approve',{group:group.key});
  if(!editable||group.approved){showGroup(groupIndex+1);return;}
  stop();return saveReview('approve',{group:group.key},groups[groupIndex+1]?.key);
});
async function loadPage(start=0,play=false){
  if(loading)return;
  stop();const version=playbackVersion;
  let received=false,initialError='';
  if(!previewReady){
    window.KowwChapterReady?.loading();
    referenceWorkspace.hidden=true;previewStartup.hidden=false;previewStartupRetry.hidden=true;
    previewStartupStatus.textContent='목소리 목록을 불러오고 있습니다...';previewStartup.setAttribute('role','status');previewStartup.setAttribute('aria-busy','true');
  }
  loading=true;if(continuous)continuous.disabled=true;updatePage();
  try{
    const endpoint=positive?'/positive-preview/queue':hard?'/hard-preview/queue':'/reference-preview/queue';
    const response=await fetch(endpoint+'?project='+encodeURIComponent(project)+(positive?`&start=${start}`:''));
    const payload=await response.json();if(!response.ok)throw Error(payload.error||'목록을 불러오지 못했습니다.');
    if(!Array.isArray(payload.items)||positive&&(payload.start!==start||!Number.isSafeInteger(payload.count)
      ||payload.items.length!==Math.min(pageSize,payload.count-start)))throw Error('음원 목록이 올바르지 않습니다.');
    if(!payload.items.length&&!(reviewEnabled&&payload.mode==='candidate_pool_v2'))throw Error(corpus?`준비된 ${subject} 음원이 없습니다.`:'준비된 기준 목소리가 없습니다.');
    loading=false;
    if(reviewEnabled)applyReview(payload);
    else{
      const loaded=parseItems(payload.items);
      mountItems(corpus?loaded:sortReferences(loaded),start,play&&version===playbackVersion,positive?payload.count:loaded.length);
      reportReferenceLayout('legacy');
    }
    received=true;
  }catch(error){errorMessage.textContent=error.message;initialError=error.message;}
  finally{
    loading=false;
    if(!requestInitialCandidates()){
      if(groups.length)syncReview();else if(continuous)continuous.disabled=!items.length;
    }
    updatePage();
    if(!previewReady){
      previewStartup.setAttribute('aria-busy','false');
      if(received){
        previewReady=true;referenceWorkspace.hidden=false;previewStartup.hidden=true;scheduleCandidateHeight(true);
        window.KowwChapterReady?.ready();
      }else{
        previewStartupStatus.textContent=initialError||'목소리 목록을 불러오지 못했습니다.';previewStartup.setAttribute('role','alert');previewStartupRetry.hidden=false;
        window.KowwChapterReady?.fail(previewStartupStatus.textContent);
      }
    }
  }
}
previewStartupRetry.addEventListener('click',()=>loadPage());
window.addEventListener('resize',()=>scheduleCandidateHeight());
window.addEventListener('pageshow',()=>{candidateHeightSuspended=false;candidateResizeObserver?.observe(referenceWorkspace);scheduleCandidateHeight(true);if(candidateSelectionBlocked)recoverCandidateSelection();});
if(typeof ResizeObserver==='function'){
  candidateResizeObserver=new ResizeObserver(()=>scheduleCandidateHeight());
  candidateResizeObserver.observe(referenceWorkspace);
}
loadPage();
</script>
