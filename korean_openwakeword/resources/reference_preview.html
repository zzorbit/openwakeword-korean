<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기준 목소리 듣기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Malgun Gothic",sans-serif;background:#171a1f;color:#e3e7ec}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{padding:16px;font-size:16px;line-height:24px}
main{width:min(640px,100%);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center}
select,button{font:inherit;color:#e9edf2;background:#292d33;border:0;border-radius:8px;transition:background .2s,color .2s}
select{width:100%;min-width:0;height:44px;padding:8px 12px;overflow:hidden;text-overflow:ellipsis}
button{height:44px;width:96px;padding:8px 12px;cursor:pointer;font-weight:500}
button:hover:not(:disabled),select:hover{background:#363d47;color:#f0f2f6}button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,audio:focus-visible{outline:2px solid #a8afb7;outline-offset:3px}
.controls{display:flex;align-items:center;justify-content:center;gap:8px}
audio{width:100%;height:44px;flex:none}p{margin:0;color:#c3cbd6;overflow-wrap:anywhere}p:empty{display:none}
#error{color:#f2a5a0}
@media(max-width:400px),(max-height:320px){body{padding:12px}button{width:80px;padding:8px}.controls{gap:8px}}
@media(max-height:320px){main{justify-content:flex-start;overflow:auto}select,.controls{flex:none}}
@media(prefers-reduced-motion:reduce){select,button{transition:none}}
</style>
<link rel="stylesheet" href="/audio_listening.css">
<style>
html.reference-listening main.listen-preview{justify-content:center;overflow:visible}
html.reference-listening .listen-workspace{display:block;width:min(560px,100%);margin:0 auto}
html.reference-listening .listen-sidebar{display:none}
html.reference-listening .listen-player{width:100%;gap:12px}
html.reference-listening .listen-heading{align-items:center;gap:12px}
html.reference-listening .listen-status{position:static}
html.reference-listening #continuous{display:none}
.voice-picker{flex:1;min-width:0}
.voice-picker-button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:40px;min-height:40px;padding:6px 8px;background:transparent;font-weight:500;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.voice-picker-button::after{content:"";flex:none;width:7px;height:7px;margin:0 4px 4px;border:solid currentColor;border-width:0 1px 1px 0;transform:rotate(45deg)}
.voice-picker-button[aria-expanded="true"]::after{transform:rotate(225deg);margin-top:4px;margin-bottom:0}
.voice-picker-list{position:fixed;z-index:10;max-height:240px;padding:4px;border:1px solid #47515e;border-radius:9px;background:#252c35;box-shadow:0 8px 22px #0005;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;outline:none}
.voice-picker-option{height:36px;padding:8px 10px;border-radius:5px;color:#dce3ec;font:400 14px/20px system-ui,"Malgun Gothic",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.voice-picker-option[data-active="true"]{background:#394555;color:#f0f2f6}
.voice-picker-option[aria-selected="true"]{font-weight:600}
.listen-playback{display:flex;flex-direction:column;gap:14px}
html.reference-listening .listen-playback{gap:0;border-radius:9px;background:#232a34}
.reference-playback-actions{display:flex;justify-content:center;gap:6px;padding:0 8px 8px}
.reference-playback-actions[hidden]{display:none}
.reference-playback-actions button{width:auto;min-width:76px;height:30px;min-height:30px;padding:3px 10px;border:1px solid #485362;background:#303945;font:500 14px/22px system-ui,"Malgun Gothic",sans-serif}
.reference-playback-actions button[aria-pressed="true"]{border-color:#8795a8;background:#47576b;color:#eef1f5}
</style>
<main class="listen-preview">
  <div class="listen-workspace">
  <aside id="listening-sidebar" class="listen-sidebar" aria-label="들을 음원 목록">
    <div id="listening-list" class="listen-list"></div>
    <div class="listen-list-pager"><button id="list-prev" type="button" aria-label="이전 음원 목록" disabled>‹</button><span id="list-position"></span><button id="list-next" type="button" aria-label="다음 음원 목록" disabled>›</button></div>
  </aside>
  <div class="listen-player">
  <div class="listen-heading"><select id="voice" class="listen-select" aria-label="들을 목소리" disabled hidden></select><div id="voice-picker" class="voice-picker" hidden><button id="voice-picker-button" class="voice-picker-button" type="button" aria-label="들을 목소리" aria-haspopup="listbox" aria-expanded="false" aria-controls="voice-picker-list" disabled></button><div id="voice-picker-list" class="voice-picker-list" role="listbox" aria-label="들을 목소리" tabindex="-1" hidden></div></div><p id="sentence" class="listen-title"></p><p id="position" class="listen-position" aria-live="polite"></p></div>
  <div class="listen-playback">
  <audio id="audio" class="listen-audio" controls preload="none"></audio>
  <div class="controls listen-controls">
    <button id="previous" type="button" disabled>이전</button>
    <button id="continuous" type="button" aria-pressed="false" disabled>재생</button>
    <button id="next" type="button" disabled>다음</button>
  </div>
  <div id="reference-playback-actions" class="reference-playback-actions" hidden><button id="play-single" type="button" aria-pressed="false" disabled>재생</button><button id="play-auto" type="button" aria-pressed="false" disabled>자동 재생</button></div>
  </div>
  <p id="error" class="listen-status" role="alert"></p>
  </div>
  </div>
</main>
<script src="/listening_player.js"></script>
<script>
'use strict';
if(window.parent!==window)document.documentElement?.classList?.add('listening-embedded');
const voice=document.getElementById('voice'), audio=document.getElementById('audio');
const previous=document.getElementById('previous'), next=document.getElementById('next');
const continuous=document.getElementById('continuous'), sentence=document.getElementById('sentence');
const position=document.getElementById('position'), errorMessage=document.getElementById('error');
const picker=document.getElementById('voice-picker'), pickerButton=document.getElementById('voice-picker-button'), pickerList=document.getElementById('voice-picker-list');
const singlePlay=document.getElementById('play-single'),autoPlay=document.getElementById('play-auto');
const hard=location.pathname.startsWith('/hard-preview/');
if(hard){document.title='유사어 전체 듣기';voice.setAttribute('aria-label','들을 유사어 음원');}
else document.documentElement?.classList?.add('reference-listening');
document.getElementById('listening-sidebar').hidden=!hard;
voice.hidden=true;sentence.hidden=!hard;picker.hidden=hard;pickerList.hidden=true;
document.getElementById('reference-playback-actions').hidden=hard;
let items=[], playing=false,playMode=hard?'auto':'single', playbackVersion=0, playbackAllowed=true,listPage=0;
let pickerOpen=false,pickerIndex=0,pickerRows=[];
const playedItems=new Set(),pageSize=5;
function notifyPicker(open){
  if(window.parent!==window)window.parent.postMessage?.({type:'koww:voice-picker',open},location.origin);
}
function positionPicker(){
  if(!pickerOpen)return;
  const rect=pickerButton.getBoundingClientRect(),margin=8,gap=6;
  const below=Math.max(0,window.innerHeight-rect.bottom-gap-margin),above=Math.max(0,rect.top-gap-margin);
  const height=Math.min(240,pickerRows.length*36+10,Math.max(below,above)),down=below>=above;
  pickerList.style.maxHeight=`${Math.floor(height)}px`;
  pickerList.style.top=`${Math.floor(down?rect.bottom+gap:Math.max(margin,rect.top-gap-height))}px`;
  pickerList.style.left=`${Math.max(margin,Math.min(rect.left,window.innerWidth-margin-rect.width))}px`;
  pickerList.style.width=`${Math.max(0,Math.min(rect.width,window.innerWidth-margin*2))}px`;
}
function highlightPicker(index){
  pickerIndex=Math.max(0,Math.min(items.length-1,index));
  pickerRows.forEach((row,i)=>row.setAttribute('data-active',String(i===pickerIndex)));
  pickerList.setAttribute('aria-activedescendant',`voice-option-${pickerIndex}`);
  const row=pickerRows[pickerIndex];
  if(row&&pickerOpen){
    if(row.offsetTop<pickerList.scrollTop)pickerList.scrollTop=row.offsetTop;
    else if(row.offsetTop+row.offsetHeight>pickerList.scrollTop+pickerList.clientHeight)pickerList.scrollTop=row.offsetTop+row.offsetHeight-pickerList.clientHeight;
  }
}
function closePicker(restoreFocus=false){
  if(!pickerOpen)return;
  pickerOpen=false;pickerList.hidden=true;pickerButton.setAttribute('aria-expanded','false');notifyPicker(false);
  if(restoreFocus)pickerButton.focus();
}
function openPicker(){
  if(hard||!items.length||pickerButton.disabled)return;
  if(!pickerOpen){pickerOpen=true;pickerList.hidden=false;pickerButton.setAttribute('aria-expanded','true');notifyPicker(true);}
  positionPicker();highlightPicker(Number(voice.value));pickerList.focus();
}
function choosePicker(index){select(index,playing);closePicker(true);}
function renderPicker(){
  if(hard)return;
  pickerRows=items.map((item,index)=>{
    const row=document.createElement('div');row.id=`voice-option-${index}`;row.className='voice-picker-option';row.setAttribute('role','option');
    row.textContent=item.label;row.addEventListener('click',()=>choosePicker(index));row.addEventListener('pointermove',()=>highlightPicker(index));return row;
  });
  pickerList.replaceChildren(...pickerRows);
}
pickerButton.addEventListener('click',()=>{if(pickerOpen)closePicker(true);else openPicker();});
pickerButton.addEventListener('keydown',event=>{
  if(!['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(event.key))return;
  event.preventDefault();
  if(['Enter',' '].includes(event.key)){if(pickerOpen)closePicker(true);else openPicker();return;}
  openPicker();if(event.key==='Home')highlightPicker(0);else if(event.key==='End')highlightPicker(items.length-1);
});
pickerList.addEventListener('keydown',event=>{
  if(!pickerOpen)return;
  if(event.key==='Tab'){closePicker();return;}
  if(!['ArrowDown','ArrowUp','Home','End','Enter',' ','Escape'].includes(event.key))return;
  event.preventDefault();
  if(event.key==='Escape'){closePicker(true);return;}
  if(['Enter',' '].includes(event.key)){choosePicker(pickerIndex);return;}
  highlightPicker(event.key==='Home'?0:event.key==='End'?items.length-1:pickerIndex+(event.key==='ArrowDown'?1:-1));
});
document.addEventListener('pointerdown',event=>{if(pickerOpen&&!picker.contains(event.target))closePicker();});
window.addEventListener('resize',()=>{positionPicker();if(pickerOpen)highlightPicker(pickerIndex);});
function renderList(){
  if(!hard)return;
  const list=document.getElementById('listening-list'),pages=Math.max(1,Math.ceil(items.length/pageSize));
  listPage=Math.min(Math.max(0,listPage),pages-1);list.replaceChildren();
  items.slice(listPage*pageSize,(listPage+1)*pageSize).forEach((item,offset)=>{
    const index=listPage*pageSize+offset,row=document.createElement('button'),title=document.createElement('span'),badge=document.createElement('span');
    row.type='button';row.className='voice-row';row.setAttribute('aria-current',String(index===Number(voice.value)));
    title.className='listen-row-title';title.textContent=item.label||item.text;badge.className='listen-badge';badge.textContent=playedItems.has(item.id)?'들음':'미청취';
    row.setAttribute('data-number',String(index+1));row.setAttribute('aria-label',`${title.textContent} · ${badge.textContent}`);
    row.append(title,badge);row.addEventListener('click',()=>select(index,playing));list.append(row);
  });
  document.getElementById('list-prev').disabled=listPage===0;document.getElementById('list-next').disabled=listPage>=pages-1;
  document.getElementById('list-position').textContent=`${listPage+1} / ${pages}`;
}
function setPlaying(value){
  playing=value;continuous.textContent=value?'일시정지':'재생';continuous.setAttribute('aria-pressed',String(value));
  singlePlay.textContent=value&&playMode==='single'?'일시정지':'재생';singlePlay.setAttribute('aria-pressed',String(value&&playMode==='single'));
  autoPlay.textContent=value&&playMode==='auto'?'일시정지':'자동 재생';autoPlay.setAttribute('aria-pressed',String(value&&playMode==='auto'));
}
function toggleMode(mode){
  if(hard||!items.length)return;
  if(playing&&playMode===mode){stop();return;}
  playMode=mode;
  if(playing)setPlaying(true);else playCurrent();
}
function stop(release=false){
  playbackVersion++;setPlaying(false);audio.pause();
  if(release){closePicker();playbackAllowed=false;audio.removeAttribute('src');audio.load();}
}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent)return;
  if(event.data?.type==='koww:voice-picker-close')closePicker();
  else if(event.data?.type==='koww:pause')stop(true);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop(true);});
window.addEventListener('pagehide',()=>stop(true));
function audioUrl(value){
  if(typeof value!=='string'||!value)throw Error('음원 경로가 올바르지 않습니다.');
  const url=new URL(value,location.href);
  if(url.origin!==location.origin||!['http:','https:'].includes(url.protocol))throw Error('음원 경로가 올바르지 않습니다.');
  return url.pathname+url.search;
}
async function playCurrent(){
  if(!items.length||document.hidden)return;
  playbackAllowed=true;
  if(!audio.getAttribute('src'))audio.src=items[Number(voice.value)].audio;
  const version=++playbackVersion;
  errorMessage.textContent='';setPlaying(true);
  try{await audio.play();}catch(error){
    if(version!==playbackVersion)return;
    setPlaying(false);errorMessage.textContent='음원을 재생하지 못했습니다. 재생을 다시 눌러주세요.';
  }
}
function select(index,play=false){
  if(!items[index])return;
  stop();
  voice.value=String(index);audio.src=items[index].audio;sentence.textContent=items[index].text;
  errorMessage.textContent='';position.textContent=`${index+1} / ${items.length}`;
  if(!hard){pickerButton.textContent=items[index].label;pickerButton.setAttribute('aria-label',`들을 목소리: ${items[index].label}`);pickerRows.forEach((row,i)=>row.setAttribute('aria-selected',String(i===index)));}
  previous.disabled=index===0;next.disabled=index===items.length-1;
  listPage=Math.floor(index/pageSize);renderList();
  if(play)playCurrent();
}
voice.addEventListener('change',()=>select(Number(voice.value),playing));
previous.addEventListener('click',()=>select(Number(voice.value)-1,playing));
next.addEventListener('click',()=>select(Number(voice.value)+1,playing));
continuous.addEventListener('click',()=>{if(playing){stop();return;}playCurrent();});
singlePlay.addEventListener('click',()=>toggleMode('single'));
autoPlay.addEventListener('click',()=>toggleMode('auto'));
audio.addEventListener('play',()=>{if(document.hidden||!playbackAllowed){stop(true);return;}setPlaying(true);});
audio.addEventListener('pause',()=>{if(!audio.ended&&audio.paused)setPlaying(false);});
audio.addEventListener('error',()=>{stop();errorMessage.textContent='음원을 재생하지 못했습니다. 재생을 다시 눌러주세요.';});
audio.addEventListener('ended',()=>{
  if(!audio.ended||!playing||!items.length||document.hidden)return;
  playedItems.add(items[Number(voice.value)].id);
  if(playMode==='auto')select((Number(voice.value)+1)%items.length,true);
  else{setPlaying(false);renderList();}
});
document.getElementById('list-prev').addEventListener('click',()=>{listPage--;renderList();});
document.getElementById('list-next').addEventListener('click',()=>{listPage++;renderList();});
window.KowwListening?.enhance(audio,document.querySelector?.('.listen-controls'),{play:continuous,previous,next});
(async()=>{
  try{
    const project=new URL(location.href).searchParams.get('project');
    const response=await fetch((hard?'/hard-preview/queue':'/reference-preview/queue')+'?project='+encodeURIComponent(project));
    const payload=await response.json();if(!response.ok)throw Error(payload.error||'목록을 불러오지 못했습니다.');
    if(!Array.isArray(payload.items))throw Error('음원 목록이 올바르지 않습니다.');
    items=payload.items.map(item=>{
      if(!item||typeof item.text!=='string'||typeof item.id!=='string')throw Error('음원 목록이 올바르지 않습니다.');
      return {...item,audio:audioUrl(item.audio)};
    });
    const groupCounts=new Map();
    items.forEach((item,index)=>{
      const option=document.createElement('option'),group=hard?item.text:item.group||'목소리';
      const count=(groupCounts.get(group)||0)+1;groupCounts.set(group,count);
      option.value=String(index);option.textContent=hard?`${item.text} · 목소리 ${count}`:`${group} · 목소리 ${count}`;item.label=option.textContent;voice.append(option);
    });
    if(!items.length)throw Error(hard?'준비된 유사어 음원이 없습니다.':'준비된 기준 목소리가 없습니다.');
    voice.disabled=false;continuous.disabled=false;pickerButton.disabled=hard;singlePlay.disabled=hard;autoPlay.disabled=hard;renderPicker();select(0);
  }catch(error){errorMessage.textContent=error.message;}
})();
</script>
</html>
