<style>

<script>
"use strict";if(window.parent!==window)document.documentElement?.classList?.add('listening-embedded');
let data,index=0,continuous=false,decisions={},referenceReview=false,pilotReview=false,pronunciationReview=false,callReviewPhase="",hardCompactReview=false,playbackVersion=0,playbackAllowed=true,started=false,listPage=0;const $=x=>document.getElementById(x),audio=$("audio"),pageSize=5;
const config=JSON.parse($("koww-page-config")?.textContent||"{}");
const labels={keep:'정상',discard:'제외',review:'다시 확인'};
const queueKind=new URLSearchParams(location.search).get('queue');
let reviewPicker,groupSummary='';
const project=new URLSearchParams(location.search).get('project'),preflightPolicy='play_started_default_keep_v1';
let preflightAutosave=false,preflightRevision=0,preflightWriter=null,preflightBlocked=false,preflightFinalizing=false,preflightFinalized=false,preflightReported='';
let preflightParentRequest=null,preflightPendingRequest=null;
let preflightPlayback=null;
let preflightChoiceTarget=null,preflightPlayRequest=null;
let preflightBadgeCache=[];
let preflightPlaybackError='';
let postReviewNotice='',postReviewError=false;
let postAllItems=null,postRetainedDecisions={},postRepairReview=false;
let preflightPickerOpen=false,preflightPickerClosing=null,preflightPickerRequest=null,preflightBaseHeight=null,preflightReportedHeight=null;
const preflightIntents=new Map(),preflightStarted=new Set(),preflightCompleted=new Set();
function postReviewBridge(){return callReviewPhase==='post'&&!data?.policy_review&&window.parent!==window&&Boolean(project);}
function hardReviewBridge(){return hardCompactReview&&window.parent!==window&&Boolean(project);}
function completedReview(){return callReviewPhase==='post'||hardCompactReview;}
function callReviewBridge(){return preflightAutosave||postReviewBridge()||hardReviewBridge();}
function hardBridgePhase(){return hardCompactReview?{phase:'hard'}:{};}
function matchingBridgePhase(phase){return hardCompactReview?phase==='hard':phase!=='hard';}
function preparePostReview(payload){
  if(callReviewPhase!=='post')return;
  postAllItems=payload.items.slice();
  const hasCarry=Object.hasOwn(payload,'retained_decisions'),hasFocus=Object.hasOwn(payload,'focus_sample_ids');
  if(!hasCarry&&!hasFocus)return;
  if(!hasCarry||!hasFocus||!payload.retained_decisions||typeof payload.retained_decisions!=='object'||Array.isArray(payload.retained_decisions)||!Array.isArray(payload.focus_sample_ids))
    throw Error('이어받을 검수 정보를 확인할 수 없습니다.');
  const rows=new Map();
  for(const row of postAllItems){
    if(rows.has(row.id)||typeof row.audio_sha256!=='string'||!/^[0-9a-f]{64}$/.test(row.audio_sha256))throw Error('이어받을 음원의 버전을 확인할 수 없습니다.');
    rows.set(row.id,row);
  }
  const retained={};
  for(const [id,answer] of Object.entries(payload.retained_decisions)){
    if(!rows.has(id)||!answer||typeof answer!=='object'||Array.isArray(answer)||answer.decision!=='keep'||answer.listened!==true||answer.audio_sha256!==rows.get(id).audio_sha256)
      throw Error('보존할 검수 결과가 현재 음원과 일치하지 않습니다.');
    retained[id]=Object.freeze({decision:'keep',listened:true});
  }
  const focus=new Set(payload.focus_sample_ids);
  if(!focus.size||focus.size!==payload.focus_sample_ids.length||[...focus].some(id=>typeof id!=='string'||!rows.has(id)||Object.hasOwn(retained,id))||
    focus.size+Object.keys(retained).length!==rows.size)throw Error('다시 검수할 음원 목록을 확인할 수 없습니다.');
  postRetainedDecisions=Object.freeze(retained);postRepairReview=true;
  payload.items=postAllItems.filter(row=>focus.has(row.id));
}
function restorePostDecisions(saved){
  const pending=new Set(data.items.map(row=>row.id)),restored={...postRetainedDecisions};
  for(const [id,answer] of Object.entries(saved||{}))if(pending.has(id)&&answer&&typeof answer==='object'&&!Array.isArray(answer)&&['keep','discard'].includes(answer.decision)&&typeof answer.listened==='boolean')restored[id]={decision:answer.decision,listened:answer.listened};
  return restored;
}
function postDecisionSnapshot(){
  const result={...postRetainedDecisions};
  for(const row of data.items)if(decisions[row.id])result[row.id]={...decisions[row.id]};
  return JSON.parse(JSON.stringify(result));
}
function clearPostReviewError(){if(!completedReview())return;postReviewError=false;postReviewNotice='';$("saved").textContent='';}
function localUrl(value){
  if(typeof value!=='string'||!value)throw Error('음원 경로가 올바르지 않습니다.');
  const url=new URL(value,location.href||location.origin+'/');
  if(url.origin!==location.origin||!['http:','https:'].includes(url.protocol))throw Error('음원 경로가 올바르지 않습니다.');
  return url.pathname+url.search;
}
function setContinuous(value){continuous=value;$("start").textContent=value?'일시정지':'재생';$("start").setAttribute('aria-pressed',String(value));}
function stop(release=false){preflightPlayback=null;preflightPlayRequest=null;setContinuous(false);started=false;playbackVersion++;audio.pause();if(release){reviewPicker?.close();playbackAllowed=false;audio.removeAttribute('src');audio.load();}}
window.addEventListener('message',event=>{
  if(event.origin!==location.origin||event.source!==window.parent)return;
  if(event.data?.type==='koww:pause'){stop(true);return;}
  if(event.data?.type==='koww:preflight-status'&&event.data.project===project&&Number.isSafeInteger(event.data.request)&&event.data.request>0){
    if(data&&!matchingBridgePhase(event.data.phase))return;
    preflightPendingRequest={queue_sha256:event.data.queue_sha256,request:event.data.request,phase:event.data.phase};
    if(callReviewBridge()&&event.data.queue_sha256===data.queue_sha256&&matchingBridgePhase(event.data.phase)){
      if(preflightParentRequest!==event.data.request&&(preflightPickerOpen||preflightPickerClosing!==null)){
        reviewPicker?.close();releasePreflightPickerLayout();
      }
      preflightParentRequest=event.data.request;reportPreflight(true);reportPreflightHeight(true);
    }return;
  }
  if(!callReviewBridge()||event.data?.project!==project||event.data.queue_sha256!==data?.queue_sha256||!matchingBridgePhase(event.data.phase))return;
  if(event.data.type==='koww:preflight-finalize'&&event.data.request===preflightParentRequest&&Number.isSafeInteger(preflightParentRequest))finalizePreflight();
  else if(event.data.type==='koww:preflight-picker-ready'&&event.data.request===preflightParentRequest&&preflightPickerOpen&&event.data.picker_request===preflightPickerRequest)reviewPicker?.reveal(event.data.picker_request);
  else if(event.data.type==='koww:preflight-picker-closed'&&Number.isSafeInteger(preflightParentRequest)&&event.data.request===preflightParentRequest&&!preflightPickerOpen&&
    Number.isSafeInteger(event.data.picker_request)&&event.data.picker_request===preflightPickerClosing){releasePreflightPickerLayout();reportPreflightHeight();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop(true);});
window.addEventListener('pagehide',()=>stop(true));
window.KowwChapterReady?.loading();
Promise.resolve().then(()=>fetch(localUrl(config.queue_url||'/queue'))).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'목록을 불러오지 못했습니다.');return d;}).then(d=>{
  if(!Array.isArray(d.items)||!d.items.length||d.items.some(r=>!r||typeof r.id!=='string'||typeof r.text!=='string'))throw Error('음원 목록이 올바르지 않습니다.');
  d.items=d.items.map(r=>({...r,audio:localUrl(r.audio)}));
  referenceReview=d.kind==='references'||queueKind==='references';
  const kind=d.kind||queueKind;
  const callReview=kind==='pilot'||kind==='positive';
  hardCompactReview=queueKind==='hard'&&d.policy_review===true&&!referenceReview&&Boolean(project);
  callReviewPhase=kind==='pilot'&&d.review_phase==='pre'?'pre':kind==='positive'&&d.review_phase==='post'?'post':'';
  if((callReviewPhase||hardCompactReview)&&(typeof d.queue_sha256!=='string'||!d.queue_sha256))throw Error('검수 목록의 버전을 확인할 수 없습니다.');
  data=d;
  pilotReview=callReview||queueKind==='pilot'||(!d.policy_review&&d.items.every(row=>row.text===d.wakeword));
  pronunciationReview=!referenceReview&&(callReview||kind==='hard'||hardCompactReview);
  $("review").hidden=pronunciationReview;
  $("purpose").textContent=d.purpose;
  if(referenceReview){
    $("review-heading").textContent='합성 목소리 확인';
    $("purpose").textContent=`이 목소리로 ‘${d.wakeword}’를 생성합니다. 아래 문장은 목소리를 재현하기 위한 샘플이며, 호출어 학습 음원으로 쓰지 않습니다.`;
    $("criteria").innerHTML='<li><b>정상:</b> 샘플 문장이 명확하고 목소리가 자연스럽습니다.</li><li><b>제외 / 다시 확인:</b> 말이 심하게 뭉개지거나, 문장에 없는 말이 나오거나, 소리가 깨집니다.</li>';
    $("review-instruction").textContent='끝까지 들으면 정상으로 표시됩니다. 목소리나 문장이 부자연스러우면 제외·다시 확인을 선택하고, 모두 확인한 뒤 결과를 저장하세요.';
  }else if(d.policy_review){
    $("policy").hidden=false;$("policy-text").textContent=d.policy_text;$("criteria").innerHTML='<li><b>정상:</b> 각 음원 아래 안내에 맞고 소리가 정상입니다.</li><li><b>제외 / 다시 확인:</b> 안내와 다르거나 소리가 깨지거나 판단이 어렵습니다.</li>';
    $("review-instruction").textContent='끝까지 들으면 정상으로 표시됩니다. 안내와 다르거나 소리가 깨지면 제외·다시 확인을 선택하고, 모두 확인한 뒤 결과를 저장하세요.';
  }
  if(pronunciationReview){
    $("criteria").innerHTML='<li><b>정상:</b> 기대 문장이 명확하고, 다른 말·문제 소리가 없습니다.</li><li><b>제외:</b> 발음이 틀리거나 다른 말이 들리거나 소리가 깨집니다.</li>';
    $("review-instruction").textContent='끝까지 들으면 정상으로 표시됩니다. 문제가 있으면 제외를 선택하고, 모두 확인한 뒤 결과를 저장하세요.';
  }
  if(callReviewPhase==='pre'){
    document.documentElement.classList.add('preflight-review');
    $("review-heading").textContent='호출어 발음 사전 검수';
    $("discard").textContent='다시 생성';
    preflightAutosave=d.autosave_policy===preflightPolicy;
    if(preflightAutosave){
      validatePreflightPayload(d);preflightRevision=d.draft_revision;decisions={...d.draft_decisions};
      if(preflightPendingRequest?.queue_sha256===d.queue_sha256&&matchingBridgePhase(preflightPendingRequest.phase))preflightParentRequest=preflightPendingRequest.request;
      $("keep").hidden=true;$("discard").textContent='부적합';$("save").hidden=true;
      $("review-instruction").textContent='호출어 샘플을 연속으로 듣고, 문제가 있는 음원만 부적합으로 표시하세요.';
    }
  }else if(callReviewPhase==='post'){
    $("review-heading").textContent='호출어 발음 검수';
    $("review-instruction").textContent='연속으로 듣고, 문제가 있는 음원만 부적합으로 표시하세요. 끝까지 재생한 음원은 적합으로 판정하며 부적합한 음원이 있으면 승인이 보류됩니다.';
    $("keep").hidden=true;$("discard").textContent='부적합';$("save").hidden=postReviewBridge();
    if(preflightPendingRequest?.queue_sha256===d.queue_sha256&&matchingBridgePhase(preflightPendingRequest.phase))preflightParentRequest=preflightPendingRequest.request;
  }else if(hardCompactReview){
    $("review-heading").textContent='유사어 발음 검수';
    $("review-instruction").textContent='연속으로 듣고, 문제가 있는 음원만 부적합으로 표시하세요. 다음을 누르면 판정을 저장하고 적합한 유사어를 학습에 사용합니다.';
    $("keep").hidden=true;$("discard").textContent='부적합';$("policy").hidden=true;
    $("save").hidden=hardReviewBridge();$("save").textContent='다음';
    if(preflightPendingRequest?.queue_sha256===d.queue_sha256&&matchingBridgePhase(preflightPendingRequest.phase))preflightParentRequest=preflightPendingRequest.request;
  }

  $("instruction").textContent=r.instruction||'';audio.src=r.audio;$("items").value=index;reviewPicker?.setSelected(index);
  $("prev").disabled=index===0;$("next").disabled=index===data.items.length-1;listPage=Math.floor(index/pageSize);renderDecision();
}
function choose(decision,event){if(!data?.items[index]||(pronunciationReview&&decision==='review'))return;
  if(preflightAutosave){
    const target=preflightChoiceTarget;preflightChoiceTarget=null;
    if(preflightBlocked||preflightFinalizing||preflightFinalized||decision!=='discard'||event?.detail>1)return;
    const row=data.items[index];
    if(target&&(target.id!==row.id||target.sha256!==row.audio_sha256))return;
    const answer=preflightIntents.get(row.id)||decisions[row.id];
    queuePreflight(row,answer?.decision==='discard'?(preflightFact(row,'playback_started')?'keep':'clear'):'discard');return;
  }
  if(completedReview()){
    const target=preflightChoiceTarget;preflightChoiceTarget=null;
    if(preflightFinalizing||preflightFinalized||decision!=='discard'||event?.detail>1)return;
    const row=data.items[index];
    if(target&&(target.id!==row.id||target.audio!==row.audio||target.version!==playbackVersion))return;
    clearPostReviewError();
    const answer=decisions[row.id];
    if(answer?.decision==='discard'){
      if(answer.listened===true)decisions[row.id]={decision:'keep',listened:true};
      else delete decisions[row.id];
    }else decisions[row.id]={decision:'discard',listened:answer?.listened===true};
    remember();renderDecision();return;
  }
  const id=data.items[index].id;decisions[id]={decision,listened:decisions[id]?.listened||false};remember();renderDecision();}
async function play(){
  if(!data?.items[index]||document.hidden)return;
  if(completedReview()&&(preflightFinalizing||preflightFinalized))return;
  if(completedReview())clearPostReviewError();
  if(preflightAutosave&&(preflightBlocked||preflightFinalizing||preflightFinalized))return;
  if(preflightAutosave){preflightPlaybackError='';renderDecision();}
  playbackAllowed=true;if(!audio.src)audio.src=data.items[index].audio;
  const version=++playbackVersion;
  if(preflightAutosave){const row=data.items[index];preflightPlayRequest={id:row.id,sha256:row.audio_sha256,version,startedAt:typeof performance==='object'?performance.now():null};}
  try{await audio.play();}catch(e){if(version!==playbackVersion)return;stop();if(preflightAutosave){preflightPlaybackError='재생하지 못했습니다. 다시 눌러주세요.';renderDecision();}else if(completedReview()){postReviewNotice='재생하지 못했습니다. 다시 눌러주세요.';renderDecision();}else $("state").textContent='재생하지 못했습니다. 다시 눌러주세요.';}
}
audio.onplay=()=>{if(!playbackAllowed||document.hidden||preflightAutosave&&(preflightBlocked||preflightFinalizing||preflightFinalized)||completedReview()&&(preflightFinalizing||preflightFinalized)){stop(true);return;}started=true;setContinuous(true);};
audio.onplaying=event=>{
  if(completedReview()){
    const row=data?.items[index];if(!row||audio.paused||document.hidden||!playbackAllowed||preflightFinalizing||preflightFinalized)return;
    if(localUrl(audio.currentSrc||audio.src)!==row.audio)return;
    preflightPlayback={id:row.id,audio:row.audio,version:playbackVersion,startedAt:typeof performance==='object'?performance.now():null};return;
  }
  const row=data?.items[index];if(!preflightAutosave||!row||audio.paused||document.hidden||!playbackAllowed||preflightBlocked||preflightFinalizing||preflightFinalized)return;
  if(localUrl(audio.currentSrc||audio.src)!==row.audio)return;
  const request=preflightPlayRequest;
  if(!request||request.id!==row.id||request.sha256!==row.audio_sha256||request.version!==playbackVersion||
    Number.isFinite(event?.timeStamp)&&Number.isFinite(request.startedAt)&&event.timeStamp<request.startedAt)return;
  preflightPlayback={id:row.id,sha256:row.audio_sha256,version:playbackVersion,startedAt:request.startedAt};
  preflightStarted.add(row.id);
  queuePreflight(row,(preflightIntents.get(row.id)||decisions[row.id])?.decision==='discard'?'discard':'keep');
  renderDecision();
};
audio.onpause=()=>{if(!audio.ended&&audio.paused){setContinuous(false);started=false;}};
audio.onerror=()=>{stop();if(preflightAutosave){preflightPlaybackError='재생하지 못했습니다. 다시 눌러주세요.';renderDecision();}else if(completedReview()){postReviewNotice='재생하지 못했습니다. 다시 눌러주세요.';renderDecision();}else $("state").textContent='재생하지 못했습니다. 다시 눌러주세요.';};
function fullyPlayed(){
  const {duration,played}=audio;
  if(!Number.isFinite(duration)||duration<=0||played.length!==1)return false;
  // Allow for rounding of media timestamps while requiring a contiguous interval.
  const tolerance=Math.min(0.02,duration*0.02);
  return played.start(0)<=tolerance&&played.end(0)>=duration-tolerance;
}
audio.onended=event=>{
  const row=data?.items[index];
  const intended=preflightAutosave?preflightPlayback?.id===row?.id&&preflightPlayback?.sha256===row?.audio_sha256&&preflightPlayback?.version===playbackVersion:started;
  if(!audio.ended||!row||!intended||!playbackAllowed||document.hidden)return;
  if(completedReview()&&(!preflightPlayback||preflightPlayback.id!==row.id||preflightPlayback.audio!==row.audio||preflightPlayback.version!==playbackVersion||localUrl(audio.currentSrc||audio.src)!==row.audio||Number.isFinite(event?.timeStamp)&&Number.isFinite(preflightPlayback.startedAt)&&event.timeStamp<preflightPlayback.startedAt))return;
  if(preflightAutosave&&(localUrl(audio.currentSrc||audio.src)!==row.audio||Number.isFinite(event?.timeStamp)&&Number.isFinite(preflightPlayback?.startedAt)&&event.timeStamp<preflightPlayback.startedAt))return;
  started=false;
  if(preflightAutosave){
    preflightPlayback=null;
    if(preflightStarted.has(row.id)&&fullyPlayed()&&Number.isFinite(audio.currentTime)&&audio.currentTime>=audio.duration-Math.min(.02,audio.duration*.02)){
      preflightCompleted.add(row.id);
      const answer=preflightIntents.get(row.id)||decisions[row.id];if(answer)queuePreflight(row,answer.decision);
    }
    if(continuous&&!preflightBlocked&&!preflightFinalizing&&!preflightFinalized&&index+1<data.items.length){index++;show();setContinuous(true);play();}
    else setContinuous(false);
    return;
  }
  const answer=decisions[row.id];
  const listened=!pronunciationReview||answer?.listened===true||fullyPlayed();
  if(listened){
    const decision=answer?.decision||'keep';
    decisions[row.id]={decision,listened:true};
    remember();renderDecision();
    if(callReviewPhase!=='pre'&&!completedReview()&&(!pronunciationReview||decision!=='review'))$("state").textContent='청취 완료 · '+decisionLabel(decision);
  }else if(!judged(row)){
    setContinuous(false);
    $("state").textContent='건너뛴 구간이 있습니다. 음원을 처음부터 끝까지 재생해 주세요.';
    if(completedReview()){postReviewNotice=$("state").textContent;$("state").hidden=false;}
    showRemainingReview(data.items.filter(item=>!judged(item)).length);
    return;
  }
  if(!continuous)return;
  if(index+1<data.items.length){index++;show();setContinuous(true);play();return;}
  setContinuous(false);
  const pending=pronunciationReview?data.items.filter(item=>!judged(item)).length:0;
  if(pending)showRemainingReview(pending);
  else if(completedReview()){postReviewNotice='';$("state").textContent='';$("state").hidden=true;}
  else $("state").textContent=pronunciationReview
    ?'모든 음원의 판정이 끝났습니다. 검수 결과를 저장하세요.'
    :'전체 청취 완료 · 검수 결과 저장을 눌러주세요.';
};
$("start").onclick=()=>{if(preflightAutosave&&(preflightBlocked||preflightFinalizing||preflightFinalized||document.hidden))return;if(continuous||!audio.paused){stop();return;}setContinuous(true);return play();};$("pause").onclick=()=>stop();for(const d of ['keep','discard','review'])$(d).onclick=event=>choose(d,event);
function capturePreflightChoice(){if(!(preflightAutosave||completedReview())||!data?.items[index])return;const row=data.items[index];preflightChoiceTarget={id:row.id,sha256:row.audio_sha256,audio:row.audio,version:playbackVersion};}
$("discard").onpointerdown=capturePreflightChoice;
$("discard").onpointercancel=()=>{preflightChoiceTarget=null;};
for(const d of ['keep','discard'])$(d).onkeydown=event=>{if(!(preflightAutosave||completedReview())||!['Enter',' '].includes(event.key))return;if(event.repeat){event.preventDefault();return;}if(d==='discard')capturePreflightChoice();};
function moveTo(value){if(!data||!Number.isInteger(value)||value<0||value>=data.items.length||completedReview()&&(preflightFinalizing||preflightFinalized))return;if(completedReview())clearPostReviewError();const resume=continuous;index=value;show();if(resume){setContinuous(true);return play();}}
$("prev").onclick=()=>moveTo(index-1);$("next").onclick=()=>moveTo(index+1);$("items").onchange=()=>moveTo(Number($("items").value));
$("list-prev").onclick=()=>{listPage--;renderList();};$("list-next").onclick=()=>{listPage++;renderList();};
$("review-pending").onclick=()=>{
  const pendingIndex=data?.items.findIndex(item=>!judged(item));
  if(pendingIndex===undefined||pendingIndex<0)return;
  showRemainingReview(0);
  index=pendingIndex;show();
  $("start").focus();
};
$("save").onclick=async()=>{
  if(!data||$("save").disabled||postReviewBridge())return;
  const pending=data.items.filter(row=>!judged(row)).length;
  if(pending){
    if(pronunciationReview)showRemainingReview(pending);
    else $("saved").textContent=`아직 ${pending}개가 남았습니다. 미청취 항목은 보존 승인하지 않습니다.`;
    return;
  }
  if(data.policy_review&&!hardCompactReview&&!$("policy-approved").checked){$("saved").textContent='아래 자료 묶음 사용 동의에 체크한 뒤 저장하세요.';return;}
  $("save").disabled=true;$("saved").textContent='결과 저장 및 자료 확인 중…';
  let retryStarted=false;
  try{
    const saveUrl=localUrl(config.save_url||'/save');
    const headers={'Content-Type':'application/json'};
    if(config.token)headers['X-Koww-Token']=config.token;
    const payload=hardCompactReview?{decisions:postDecisionSnapshot(),queue_sha256:data.queue_sha256,policy_approved:true}
      :callReviewPhase?{decisions:callReviewPhase==='post'?postDecisionSnapshot():decisions,queue_sha256:data.queue_sha256}
      :data.policy_review?{decisions,policy_approved:$("policy-approved").checked}:decisions;
    const response=await fetch(saveUrl,{method:'POST',headers,body:JSON.stringify(payload)});
    if(!response.ok)throw Error(await response.text());
    const result=await response.json();
    if(callReviewPhase==='post'&&result.review_finalized===true&&result.workflow_action==='repair'&&
      ['postgeneration_repair_started','postgeneration_repair_pending'].includes(result.state)){
      retryStarted=true;preflightFinalized=true;stop();renderDecision();
      $("saved").textContent='판정을 저장했습니다. 학습 페이지에서 다시 생성한 음원을 검수해 주세요.';return;
    }
    retryStarted=callReviewPhase==='pre'&&['pilot_retry_started','pilot_retry_pending'].includes(result.state);
    if(retryStarted){
      stop();
      $("saved").textContent=result.state==='pilot_retry_pending'
        ? '판정을 저장했습니다. 사전 생성 단계에서 재개하면 표시한 목소리를 다시 생성합니다.'
        : '판정을 저장했습니다. 표시한 목소리를 다시 생성합니다.';
      return;
    }
    if(callReviewPhase==='post'&&(result.policy_approved===false||data.items.some(row=>decisions[row.id]?.decision==='discard'))){
      $("saved").textContent='본생성 승인이 보류됐습니다. 제외한 음원을 다시 듣고 판정을 확인하세요.';
      return;
    }
    const hold=data.items.some(r=>decisions[r.id]?.decision==='review')||!data.items.some(r=>decisions[r.id]?.decision==='keep')||['content_exceptions_pending','pilot_exceptions_need_policy_fix','review_incomplete_or_policy_rejected'].includes(result.state);
    $("saved").textContent=hold?'판정을 저장했습니다. 다음 단계로 진행하기 전에 문제 항목을 확인하세요.':config.saved_message||'검수 결과를 저장했습니다.';
  }catch(e){$("saved").textContent='저장 실패 · '+e.message;}
  finally{if(!retryStarted)$("save").disabled=false;}
};
