<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 호출어 검수</title>
<style>
:root{color-scheme:dark;--canvas:#0d1117;--surface:#151b23;--control:#212830;--border:#3d444d;--line:#212830;--fg:#c9d1d9;--muted:#b1bac4;--blue:#4493f8;--focus:#1f6feb;--green:#3fb950;--amber:#d29922;--danger:#f85149;--primary:#1f7330;--primary-hover:#196c2e;font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--fg);background:var(--canvas)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font-size:14px}main{max-width:1080px;margin:16px auto;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
h1{font-size:22px;line-height:1.3;margin:0}h2{font-size:17px;line-height:1.4;margin:0;overflow-wrap:anywhere}
p{line-height:1.55;color:var(--muted);margin:8px 0}p:empty{display:none}
button,select{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--control);color:var(--fg);cursor:pointer;margin:0}
button:hover:not(:disabled){background:var(--border)}
#start,#save{background:var(--primary);border-color:var(--primary);color:#dce4ec}
#start:hover:not(:disabled),#save:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,audio:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}input{accent-color:var(--primary)}
option{background:var(--control);color:var(--fg)}a{color:var(--blue)}
audio{width:100%;height:44px;margin:0}li{margin:0 0 12px}.buttons{display:flex;align-items:center;flex-wrap:wrap;gap:6px}#state{font-weight:700;color:var(--blue)}
.review-header{border-bottom:1px solid var(--line);padding-bottom:10px}.review-workspace{display:grid;grid-template-columns:minmax(190px,.75fr) minmax(0,2fr);gap:24px;margin:16px 0;min-height:0}
.review-guidance{border-right:1px solid var(--line);padding-right:20px}.review-guidance h2{font-size:13px;color:var(--muted);margin-bottom:12px}.review-guidance ul{padding-left:18px;margin:0}.review-guidance p{font-size:12px}
.review-player{display:flex;flex-direction:column;gap:8px;min-width:0}.review-player p{margin:0}.review-player #title{margin-top:4px}.review-player #items{flex:1;min-width:130px;max-width:100%}
.review-footer{border-top:1px solid var(--line);padding-top:10px}.review-save{display:flex;gap:14px;align-items:center;justify-content:space-between}.review-save p{font-size:12px;margin:0}#save{flex-shrink:0}#policy{display:block;font-size:13px;margin:0 0 10px}#saved{font-size:13px;overflow-wrap:anywhere;margin-bottom:0}
@media(min-width:720px) and (min-height:440px){html,body{height:100%;overflow:hidden}main{height:100dvh;max-width:none;margin:0;border:0;border-radius:0;padding:14px 18px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}.review-workspace{margin:0;overflow:auto}.review-header p{margin-bottom:0}.review-player{justify-content:center}.review-footer{max-height:32vh;overflow:auto}}
@media(max-width:719px){main{margin:0;border:0;border-radius:0;padding:16px}.review-workspace{grid-template-columns:1fr;gap:14px}.review-guidance{border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px}.review-guidance ul{display:grid;gap:8px}.review-guidance li{margin:0}.review-save{align-items:flex-start;flex-wrap:wrap}}
</style>
<main><header class="review-header"><h1 id="review-heading">오디오 검수</h1><p id="purpose"></p></header><div class="review-workspace"><aside class="review-guidance" aria-label="검수 기준"><h2>판단 기준</h2><ul id="criteria"><li><b>보존:</b> 기대 문장이 명확하고, 다른 말·문제 소리가 없습니다.</li><li><b>폐기 / 재검수:</b> 발음이 틀리거나 다른 말이 들리거나 판단이 어렵습니다.</li></ul><p>끝까지 들으면 자동으로 보존됩니다. 문제가 있는 번호만 바꾸세요.</p></aside><section class="review-player" aria-label="음원 듣기와 판정">
<div class="buttons"><button id="start">연속 듣기 시작</button><button id="pause">일시정지</button><button id="keep">보존</button><button id="discard">폐기</button><button id="review">재검수</button></div>
<h2 id="title"></h2><p id="expected"></p><p id="instruction"></p><audio id="audio" controls></audio><p id="state"></p><div class="buttons"><button id="prev">이전</button><button id="next">다음</button><select id="items"></select></div>
</section></div><footer class="review-footer"><label id="policy" hidden><input id="policy-approved" type="checkbox"> <span id="policy-text"></span></label><div class="review-save"><p>검수 결과는 작업 폴더에 저장됩니다.</p><button id="save">검수 완료 · 저장</button></div><p id="saved" role="status"></p></footer></main>
<!--KOWW_PAGE_CONFIG-->
<script>
"use strict";let data,index=0,continuous=false,decisions={},referenceReview=false;const $=x=>document.getElementById(x),audio=$("audio");
const config=JSON.parse($("koww-page-config")?.textContent||"{}");
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='koww:pause')return;continuous=false;audio.pause();});
fetch(config.queue_url||'/queue').then(r=>r.json()).then(d=>{
  data=d;
  referenceReview=d.kind==='references'||new URLSearchParams(location.search).get('queue')==='references';
  $("purpose").textContent=d.purpose;
  if(referenceReview){
    $("review-heading").textContent='합성 목소리 확인';
    $("purpose").textContent=`이 목소리로 ‘${d.wakeword}’를 생성합니다. 아래 문장은 목소리를 재현하기 위한 샘플이며, 호출어 학습 음원으로 쓰지 않습니다.`;
    $("criteria").innerHTML='<li><b>보존:</b> 샘플 문장이 명확하고 목소리가 자연스럽습니다.</li><li><b>폐기 / 재검수:</b> 말이 심하게 뭉개지거나, 문장에 없는 말이 나오거나, 소리가 깨집니다.</li>';
  }else if(d.policy_review){
    $("policy").hidden=false;$("policy-text").textContent=d.policy_text;$("criteria").innerHTML='<li><b>보존:</b> 각 음원 아래 안내에 맞고 소리가 정상입니다.</li><li><b>폐기 / 재검수:</b> 안내와 다르거나 소리가 깨지거나 판단이 어렵습니다.</li>';
  }
  d.items.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${r.group||r.id}`;$("items").append(o);});
  try{decisions=JSON.parse(localStorage.getItem('koww:'+d.queue_sha256)||'{}');}catch(e){}
  show();
}).catch(e=>{$("saved").textContent='목록을 불러오지 못했습니다: '+e.message;});
function key(){return 'koww:'+data.queue_sha256;}function remember(){localStorage.setItem(key(),JSON.stringify(decisions));}function show(){const r=data.items[index];$("title").textContent=`${index+1} / ${data.items.length} · ${r.group||r.id}`;$("expected").textContent=(referenceReview?'샘플 문장: ':r.group?'확인할 소리: ':'기대 문장: ')+r.text;$("instruction").textContent=r.instruction||'';audio.src=r.audio;$("items").value=index;$("state").textContent=decisions[r.id]?.decision||'아직 듣지 않음';}
function choose(decision){const id=data.items[index].id;decisions[id]={decision,listened:decisions[id]?.listened||false};remember();$("state").textContent=decision;}
async function play(){show();try{await audio.play();}catch(e){continuous=false;$("state").textContent='재생 실패: '+e.message;}}
audio.onended=()=>{const id=data.items[index].id;decisions[id]={decision:decisions[id]?.decision||'keep',listened:true};remember();$("state").textContent='청취 완료 · '+decisions[id].decision;if(continuous&&index+1<data.items.length){index++;play();}else if(continuous){continuous=false;$("state").textContent='전체 청취 완료. 검수 완료 · 저장을 누르세요.';}};
$("start").onclick=()=>{continuous=true;play();};$("pause").onclick=()=>{continuous=false;audio.pause();};for(const d of ['keep','discard','review'])$(d).onclick=()=>choose(d);
$("prev").onclick=()=>{if(index){index--;continuous?play():show();}};$("next").onclick=()=>{if(index+1<data.items.length){index++;continuous?play():show();}};$("items").onchange=()=>{index=Number($("items").value);continuous?play():show();};
$("save").onclick=async()=>{if(!data)return;const pending=data.items.filter(r=>!decisions[r.id]||(decisions[r.id].decision==='keep'&&!decisions[r.id].listened));if(pending.length){$("saved").textContent=`아직 ${pending.length}개가 남았습니다. 미청취 항목은 보존 승인하지 않습니다.`;return;}if(data.policy_review&&!$("policy-approved").checked){$("saved").textContent='아래 자료 묶음 사용 동의에 체크한 뒤 저장하세요.';return;}$("save").disabled=true;$("saved").textContent='결과 저장 및 자료 확인 중…';try{const headers={'Content-Type':'application/json'};if(config.token)headers['X-Koww-Token']=config.token;const response=await fetch(config.save_url||'/save',{method:'POST',headers,body:JSON.stringify(data.policy_review?{decisions,policy_approved:$("policy-approved").checked}:decisions)});if(!response.ok)throw Error(await response.text());const result=await response.json();$("saved").textContent=result.state==='content_exceptions_pending'?'저장 완료 · 문제 항목을 확인한 뒤 다음 단계로 진행합니다.':config.saved_message||'저장 완료 · 채팅에서 완료했다고 알려주세요.';}catch(e){$("saved").textContent='저장 실패 · '+e.message;}finally{$("save").disabled=false;}};
</script></html>
