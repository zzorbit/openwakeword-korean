<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 호출어 검수</title>
<style>
:root{color-scheme:dark;--canvas:#171a1f;--surface:#20242b;--control:#292d33;--border:#48505c;--line:#343b46;--fg:#eaedf1;--muted:#c3cbd6;--focus:#a8afb7;font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--fg);background:var(--canvas)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-size:16px;line-height:24px}main{width:min(760px,100%);height:100dvh;margin:auto;padding:16px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
h1{font-size:18px;line-height:26px;font-weight:600;margin:0}h2{font-size:18px;line-height:26px;font-weight:600;margin:0;overflow-wrap:anywhere}p{line-height:24px;color:var(--muted);margin:8px 0}p:empty{display:none}
button,select{font:500 16px/24px system-ui,"Malgun Gothic",sans-serif;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:var(--control);color:#e9edf2;cursor:pointer;margin:0;transition:background .2s,color .2s}
button:hover:not(:disabled),select:hover{background:#363d47;color:#f0f2f6}button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,audio:focus-visible{outline:2px solid var(--focus);outline-offset:3px}input{accent-color:#97aac5}option{background:var(--control);color:var(--fg)}
audio{width:100%;height:44px;margin:0;flex:none}.buttons{display:flex;align-items:center;justify-content:center;gap:8px}.buttons button{min-width:80px}#state{font-weight:500;color:#b9cbe5;font-size:14px;line-height:20px}
.review-header{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}.review-workspace{min-height:0;display:flex;flex-direction:column;overflow:auto}
.review-guidance{position:relative;flex:none}.review-guidance summary{cursor:pointer;font-size:14px;line-height:20px;font-weight:500;padding:8px 10px;border-radius:6px;background:var(--control);white-space:nowrap}.review-guidance-content{position:absolute;z-index:2;right:0;top:calc(100% + 8px);width:360px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 88px);overflow:auto;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px #0006}.review-guidance ul{padding-left:18px;margin:0}.review-guidance li{margin:0 0 8px}.review-guidance p{font-size:14px;line-height:22px}.review-guidance #instruction{color:var(--fg);margin-top:16px}
.review-player{display:flex;flex-direction:column;gap:12px;width:100%;min-width:0;flex:none;margin:auto 0}.review-player p{margin:0}.review-item-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px}.review-item-heading #expected{font-size:18px;line-height:26px;color:var(--fg)}.review-item-heading #state{margin-left:auto}.review-player #items{width:100%;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}.review-decisions button[aria-pressed="true"]{background:#485462;color:#f0f2f6}.review-footer{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}.review-save{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}#save{min-width:160px}#policy{width:100%;font-size:14px;line-height:22px;margin:0}#saved{font-size:14px;line-height:20px;overflow-wrap:anywhere;margin:0;text-align:center}
@media(max-width:480px),(max-height:480px){main{padding:12px;gap:10px}.review-player{gap:8px}.review-footer{gap:6px}.review-save{gap:6px}.review-item-heading #expected{font-size:16px;line-height:24px}.buttons button{min-width:72px;padding:8px}.review-header h1{font-size:16px;line-height:24px}}
@media(max-width:340px){.review-item-heading #state{margin-left:0}.review-guidance summary{padding:6px 8px}}
@media(prefers-reduced-motion:reduce){button,select{transition:none}}
</style>
<main><header class="review-header"><h1 id="review-heading">오디오 검수</h1><details class="review-guidance" aria-label="검수 기준"><summary>판단 기준</summary><div class="review-guidance-content"><p id="purpose"></p><ul id="criteria"><li><b>정상:</b> 기대 문장이 명확하고, 다른 말·문제 소리가 없습니다.</li><li><b>제외 / 다시 확인:</b> 발음이 틀리거나 다른 말이 들리거나 판단이 어렵습니다.</li></ul><p>끝까지 들은 음원은 정상으로 표시됩니다. 문제가 있는 음원만 바꾸세요.</p><p id="instruction"></p><p>검수 완료를 누르면 결과가 작업 폴더에 저장됩니다.</p></div></details></header><div class="review-workspace"><section class="review-player" aria-label="음원 듣기와 판정">
<div class="review-item-heading"><h2 id="title"></h2><p id="expected"></p><p id="state" role="status"></p></div><audio id="audio" controls preload="none"></audio><div class="buttons"><button id="start">연속 재생</button><button id="pause">일시정지</button></div>
<div class="buttons review-decisions" role="group" aria-label="음원 판정"><button id="keep" aria-pressed="false">정상</button><button id="discard" aria-pressed="false">제외</button><button id="review" aria-pressed="false">다시 확인</button></div><select id="items" aria-label="확인할 음원"></select><div class="buttons"><button id="prev">이전 음원</button><button id="next">다음 음원</button></div>
</section></div><footer class="review-footer"><label id="policy" hidden><input id="policy-approved" type="checkbox"> <span id="policy-text"></span></label><div class="review-save"><p id="saved" role="status"></p><button id="save">검수 완료 · 저장</button></div></footer></main>
<!--KOWW_PAGE_CONFIG-->
<script>
"use strict";let data,index=0,continuous=false,decisions={},referenceReview=false,playbackVersion=0,playbackAllowed=true,started=false;const $=x=>document.getElementById(x),audio=$("audio");
const config=JSON.parse($("koww-page-config")?.textContent||"{}");
const labels={keep:'정상',discard:'제외',review:'다시 확인'};
function stop(release=false){continuous=false;started=false;playbackVersion++;audio.pause();if(release){playbackAllowed=false;audio.removeAttribute('src');audio.load();}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='koww:pause')return;stop(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop(true);});
window.addEventListener('pagehide',()=>stop(true));
fetch(config.queue_url||'/queue').then(r=>r.json()).then(d=>{
  data=d;
  referenceReview=d.kind==='references'||new URLSearchParams(location.search).get('queue')==='references';
  $("purpose").textContent=d.purpose;
  if(referenceReview){
    $("review-heading").textContent='합성 목소리 확인';
    $("purpose").textContent=`이 목소리로 ‘${d.wakeword}’를 생성합니다. 아래 문장은 목소리를 재현하기 위한 샘플이며, 호출어 학습 음원으로 쓰지 않습니다.`;
    $("criteria").innerHTML='<li><b>정상:</b> 샘플 문장이 명확하고 목소리가 자연스럽습니다.</li><li><b>제외 / 다시 확인:</b> 말이 심하게 뭉개지거나, 문장에 없는 말이 나오거나, 소리가 깨집니다.</li>';
  }else if(d.policy_review){
    $("policy").hidden=false;$("policy-text").textContent=d.policy_text;$("criteria").innerHTML='<li><b>정상:</b> 각 음원 아래 안내에 맞고 소리가 정상입니다.</li><li><b>제외 / 다시 확인:</b> 안내와 다르거나 소리가 깨지거나 판단이 어렵습니다.</li>';
  }
  d.items.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${r.text||r.group||'음원'}`;$("items").append(o);});
  try{decisions=JSON.parse(localStorage.getItem('koww:'+d.queue_sha256)||'{}');}catch(e){}
  show();
}).catch(e=>{$("saved").textContent='목록을 불러오지 못했습니다: '+e.message;});
function key(){return 'koww:'+data.queue_sha256;}
function remember(){localStorage.setItem(key(),JSON.stringify(decisions));}
function renderDecision(){const decision=decisions[data.items[index].id]?.decision;$("state").textContent=labels[decision]||'아직 듣지 않음';for(const value of ['keep','discard','review'])$(value).setAttribute('aria-pressed',String(decision===value));}
function show(){
  const r=data.items[index];if(!r)return;
  playbackVersion++;started=false;audio.pause();playbackAllowed=true;
  $("title").textContent=`${index+1} / ${data.items.length}`;
  $("expected").textContent=(referenceReview?'샘플 문장: ':r.group?'확인할 소리: ':'기대 문장: ')+r.text;
  $("instruction").textContent=r.instruction||'';audio.src=r.audio;$("items").value=index;
  $("prev").disabled=index===0;$("next").disabled=index===data.items.length-1;renderDecision();
}
function choose(decision){if(!data?.items[index])return;const id=data.items[index].id;decisions[id]={decision,listened:decisions[id]?.listened||false};remember();renderDecision();}
async function play(){if(!data?.items[index]||document.hidden)return;const keepContinuous=continuous;show();continuous=keepContinuous;const version=playbackVersion;try{await audio.play();}catch(e){if(version!==playbackVersion)return;continuous=false;$("state").textContent='재생하지 못했습니다. 다시 눌러주세요.';}}
audio.onplay=()=>{if(!playbackAllowed||document.hidden){stop(true);return;}started=true;};
audio.onpause=()=>{if(!audio.ended&&audio.paused){continuous=false;started=false;}};
audio.onended=()=>{
  if(!audio.ended||!data?.items[index]||!started||!playbackAllowed||document.hidden)return;
  started=false;const id=data.items[index].id;
  decisions[id]={decision:decisions[id]?.decision||'keep',listened:true};remember();renderDecision();
  $("state").textContent='청취 완료 · '+labels[decisions[id].decision];
  if(continuous&&index+1<data.items.length){index++;play();}
  else if(continuous){continuous=false;$("state").textContent='전체 청취 완료 · 검수 완료를 눌러 저장하세요.';}
};
$("start").onclick=()=>{continuous=true;play();};$("pause").onclick=()=>stop();for(const d of ['keep','discard','review'])$(d).onclick=()=>choose(d);
$("prev").onclick=()=>{if(index){index--;continuous?play():show();}};$("next").onclick=()=>{if(data&&index+1<data.items.length){index++;continuous?play():show();}};$("items").onchange=()=>{if(!data)return;index=Number($("items").value);continuous?play():show();};
$("save").onclick=async()=>{if(!data)return;const pending=data.items.filter(r=>!decisions[r.id]||(decisions[r.id].decision==='keep'&&!decisions[r.id].listened));if(pending.length){$("saved").textContent=`아직 ${pending.length}개가 남았습니다. 미청취 항목은 보존 승인하지 않습니다.`;return;}if(data.policy_review&&!$("policy-approved").checked){$("saved").textContent='아래 자료 묶음 사용 동의에 체크한 뒤 저장하세요.';return;}$("save").disabled=true;$("saved").textContent='결과 저장 및 자료 확인 중…';try{const headers={'Content-Type':'application/json'};if(config.token)headers['X-Koww-Token']=config.token;const response=await fetch(config.save_url||'/save',{method:'POST',headers,body:JSON.stringify(data.policy_review?{decisions,policy_approved:$("policy-approved").checked}:decisions)});if(!response.ok)throw Error(await response.text());const result=await response.json();$("saved").textContent=result.state==='content_exceptions_pending'?'저장 완료 · 문제 항목을 확인한 뒤 다음 단계로 진행합니다.':config.saved_message||'저장 완료 · 채팅에서 완료했다고 알려주세요.';}catch(e){$("saved").textContent='저장 실패 · '+e.message;}finally{$("save").disabled=false;}};
</script></html>
