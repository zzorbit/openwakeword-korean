<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 호출어 검수</title>
<style>body{font-family:system-ui,"Malgun Gothic",sans-serif;background:#f4f6fa;color:#24334c;margin:0}main{max-width:880px;margin:40px auto;padding:25px;background:white;border-radius:15px}p{line-height:1.7;color:#52617b}button,select{font:inherit;padding:12px 17px;border:1px solid #cbd6e6;border-radius:8px;background:white;cursor:pointer;margin:5px}button:first-child{background:#295cc1;color:white}audio{width:100%;margin:15px 0}li{margin:8px 0}.buttons{display:flex;flex-wrap:wrap}#state{font-weight:700;color:#295cc1}</style>
<main><h1>오디오 검수</h1><p id="purpose"></p><ul><li><b>보존:</b> 기대 문장이 명확하고, 다른 말·문제 소리가 없습니다.</li><li><b>폐기 / 재검수:</b> 발음이 틀리거나 다른 말이 들리거나 판단이 어렵습니다.</li></ul><p>끝까지 들으면 자동으로 보존됩니다. 문제가 있는 번호만 바꾸세요. 생성된 큐 전체를 한 번에 제공합니다.</p>
<div class="buttons"><button id="start">연속 듣기 시작</button><button id="pause">일시정지</button><button id="keep">보존</button><button id="discard">폐기</button><button id="review">재검수</button></div>
<h2 id="title"></h2><p id="expected"></p><audio id="audio" controls></audio><p id="state"></p><div class="buttons"><button id="prev">이전</button><button id="next">다음</button><select id="items"></select></div>
<hr><p>결과는 이 프로젝트에 직접 저장됩니다. 결과 복사·붙여넣기는 필요 없습니다.</p><button id="save">검수 완료 · 저장</button><p id="saved" role="status"></p></main>
<script>
"use strict";let data,index=0,continuous=false,decisions={};const $=x=>document.getElementById(x),audio=$("audio");
fetch('/queue').then(r=>r.json()).then(d=>{data=d;$("purpose").textContent=d.purpose;d.items.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${r.id}`;$("items").append(o);});try{decisions=JSON.parse(localStorage.getItem('koww:'+d.queue_sha256)||'{}');}catch(e){}show();});
function key(){return 'koww:'+data.queue_sha256;}function remember(){localStorage.setItem(key(),JSON.stringify(decisions));}function show(){const r=data.items[index];$("title").textContent=`${index+1} / ${data.items.length} · ${r.id}`;$("expected").textContent='기대 문장: '+r.text;audio.src=r.audio;$("items").value=index;$("state").textContent=decisions[r.id]?.decision||'아직 듣지 않음';}
function choose(decision){const id=data.items[index].id;decisions[id]={decision,listened:decisions[id]?.listened||false};remember();$("state").textContent=decision;}
async function play(){show();try{await audio.play();}catch(e){continuous=false;$("state").textContent='재생 실패: '+e.message;}}
audio.onended=()=>{const id=data.items[index].id;decisions[id]={decision:decisions[id]?.decision||'keep',listened:true};remember();$("state").textContent='청취 완료 · '+decisions[id].decision;if(continuous&&index+1<data.items.length){index++;play();}else if(continuous){continuous=false;$("state").textContent='전체 청취 완료. 검수 완료 · 저장을 누르세요.';}};
$("start").onclick=()=>{continuous=true;play();};$("pause").onclick=()=>{continuous=false;audio.pause();};for(const d of ['keep','discard','review'])$(d).onclick=()=>choose(d);
$("prev").onclick=()=>{if(index){index--;continuous?play():show();}};$("next").onclick=()=>{if(index+1<data.items.length){index++;continuous?play():show();}};$("items").onchange=()=>{index=Number($("items").value);continuous?play():show();};
$("save").onclick=async()=>{const pending=data.items.filter(r=>!decisions[r.id]||(decisions[r.id].decision==='keep'&&!decisions[r.id].listened));if(pending.length){$("saved").textContent=`아직 ${pending.length}개가 남았습니다. 미청취 항목은 보존 승인하지 않습니다.`;return;}const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(decisions)});$("saved").textContent=response.ok?'저장 완료 · '+await response.text():'저장 실패 · '+await response.text();};
</script></html>
