<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한국어 호출어 검수</title>
<style>
:root{color-scheme:dark;--canvas:#171a1f;--surface:#20242b;--control:#292d33;--border:#48505c;--line:#343b46;--fg:#eaedf1;--muted:#c3cbd6;--focus:#a8afb7;font-family:system-ui,"Malgun Gothic",sans-serif;color:var(--fg);background:var(--canvas)}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-size:16px;line-height:24px}main{width:min(760px,100%);height:100dvh;margin:auto;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:18px;line-height:26px;font-weight:600;margin:0}h2{font-size:18px;line-height:26px;font-weight:600;margin:0;overflow-wrap:anywhere}p{line-height:24px;color:var(--muted);margin:8px 0}p:empty{display:none}
button,select{font:500 16px/24px system-ui,"Malgun Gothic",sans-serif;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:var(--control);color:#e9edf2;cursor:pointer;margin:0;transition:background .2s,color .2s}
button:hover:not(:disabled),select:hover{background:#363d47;color:#f0f2f6}button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,audio:focus-visible{outline:2px solid var(--focus);outline-offset:3px}input{accent-color:#97aac5}option{background:var(--control);color:var(--fg)}
audio{width:100%;height:44px;margin:0;flex:none}.buttons{display:flex;align-items:center;justify-content:center;gap:8px}.buttons button{min-width:80px}
.review-header{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}.review-workspace{min-height:0;flex:0 1 auto;display:flex;flex-direction:column;overflow:auto}
.review-intro{display:grid;gap:8px;min-width:0;flex:none;width:min(660px,100%);margin:0 auto}.review-intro p{margin:0}
.review-guidance{position:relative;flex:none}.review-guidance summary{cursor:pointer;font-size:14px;line-height:20px;font-weight:500;padding:8px 10px;border-radius:6px;background:var(--control);white-space:nowrap}.review-guidance-content{position:absolute;z-index:2;right:0;top:calc(100% + 8px);width:360px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 88px);overflow:auto;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px #0006}.review-guidance ul{padding-left:18px;margin:0}.review-guidance li{margin:0 0 8px}.review-guidance p{font-size:14px;line-height:22px}.review-guidance #instruction{color:var(--fg);margin-top:16px}
.review-player{flex:none;margin:auto}.review-player p{margin:0}.review-player #items{max-width:100%}.review-decisions button[aria-pressed="true"]{background:#485462;color:#f0f2f6}.review-footer{width:min(660px,100%);margin:0 auto;flex:none;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}.review-save{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}#save{min-width:160px}#policy{width:100%;font-size:14px;line-height:22px;margin:0}#saved{font-size:14px;line-height:20px;overflow-wrap:anywhere;margin:0;text-align:center}
@media(max-width:480px),(max-height:480px){main{padding:12px;gap:10px}.review-footer{gap:6px}.review-save{gap:6px}.buttons button{min-width:72px;padding:8px}.review-header h1{font-size:16px;line-height:24px}}
@media(max-width:340px){.review-guidance summary{padding:6px 8px}}
@media(prefers-reduced-motion:reduce){button,select{transition:none}}
</style>
<link rel="stylesheet" href="/audio_listening.css">
<main><div class="review-intro"><header class="review-header"><h1 id="review-heading">듣고 판정해 주세요</h1><details class="review-guidance" aria-label="검수 기준"><summary>판단 기준</summary><div class="review-guidance-content"><p id="purpose"></p><ul id="criteria"><li><b>정상:</b> 기대 문장이 명확하고, 다른 말·문제 소리가 없습니다.</li><li><b>제외 / 다시 확인:</b> 발음이 틀리거나 다른 말이 들리거나 판단이 어렵습니다.</li></ul><p id="instruction"></p><p>검수 결과 저장을 누르면 판정이 작업 폴더에 저장됩니다.</p></div></details></header><p id="review-instruction" class="listen-instruction">끝까지 들으면 정상으로 표시됩니다. 발음이 다르면 제외·다시 확인을 선택하고, 모두 확인한 뒤 결과를 저장하세요.</p><p id="review-progress" class="listen-summary" role="status"></p></div><div class="review-workspace"><div class="listen-workspace"><aside class="listen-sidebar" aria-label="확인할 음원 목록"><div id="listening-list" class="listen-list"></div><div class="listen-list-pager"><button id="list-prev" type="button" aria-label="이전 음원 목록" disabled>‹</button><span id="list-position"></span><button id="list-next" type="button" aria-label="다음 음원 목록" disabled>›</button></div></aside><section class="review-player listen-player" aria-label="음원 듣기와 판정">
<div class="listen-heading"><p id="expected" class="listen-title"></p><h2 id="title" class="listen-position"></h2></div><audio id="audio" class="listen-audio" controls preload="none"></audio><div class="buttons listen-controls"><button id="prev" type="button" disabled>이전</button><button id="start" type="button" aria-pressed="false" disabled>재생</button><button id="next" type="button" disabled>다음</button><button id="pause" type="button" hidden>일시정지</button></div>
<select id="items" class="listen-select" aria-label="확인할 음원" disabled hidden></select><p id="state" class="listen-status" role="status"></p><div class="buttons review-decisions listen-decisions" role="group" aria-label="음원 판정"><button id="keep" aria-pressed="false">정상</button><button id="discard" aria-pressed="false">제외</button><button id="review" aria-pressed="false">다시 확인</button></div>
</section></div></div><footer class="review-footer"><label id="policy" hidden><input id="policy-approved" type="checkbox"> <span id="policy-text"></span></label><div class="review-save"><p id="saved" role="status"></p><button id="save">검수 결과 저장</button></div></footer></main>
<!--KOWW_PAGE_CONFIG-->
<script src="/listening_player.js"></script>
<script>
"use strict";if(window.parent!==window)document.documentElement?.classList?.add('listening-embedded');
let data,index=0,continuous=false,decisions={},referenceReview=false,pilotReview=false,playbackVersion=0,playbackAllowed=true,started=false,listPage=0;const $=x=>document.getElementById(x),audio=$("audio"),pageSize=5;
const config=JSON.parse($("koww-page-config")?.textContent||"{}");
const labels={keep:'정상',discard:'제외',review:'다시 확인'};
function localUrl(value){
  if(typeof value!=='string'||!value)throw Error('음원 경로가 올바르지 않습니다.');
  const url=new URL(value,location.href||location.origin+'/');
  if(url.origin!==location.origin||!['http:','https:'].includes(url.protocol))throw Error('음원 경로가 올바르지 않습니다.');
  return url.pathname+url.search;
}
function setContinuous(value){continuous=value;$("start").textContent=value?'일시정지':'재생';$("start").setAttribute('aria-pressed',String(value));}
function stop(release=false){setContinuous(false);started=false;playbackVersion++;audio.pause();if(release){playbackAllowed=false;audio.removeAttribute('src');audio.load();}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='koww:pause')return;stop(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop(true);});
window.addEventListener('pagehide',()=>stop(true));
Promise.resolve().then(()=>fetch(localUrl(config.queue_url||'/queue'))).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'목록을 불러오지 못했습니다.');return d;}).then(d=>{
  if(!Array.isArray(d.items)||!d.items.length||d.items.some(r=>!r||typeof r.id!=='string'||typeof r.text!=='string'))throw Error('음원 목록이 올바르지 않습니다.');
  d.items=d.items.map(r=>({...r,audio:localUrl(r.audio)}));
  data=d;
  referenceReview=d.kind==='references'||new URLSearchParams(location.search).get('queue')==='references';
  pilotReview=d.kind==='pilot'||new URLSearchParams(location.search).get('queue')==='pilot'||(!d.policy_review&&d.items.every(row=>row.text===d.wakeword));
  $("purpose").textContent=d.purpose;
  if(referenceReview){
    $("review-heading").textContent='합성 목소리 확인';
    $("purpose").textContent=`이 목소리로 ‘${d.wakeword}’를 생성합니다. 아래 문장은 목소리를 재현하기 위한 샘플이며, 호출어 학습 음원으로 쓰지 않습니다.`;
    $("criteria").innerHTML='<li><b>정상:</b> 샘플 문장이 명확하고 목소리가 자연스럽습니다.</li><li><b>제외 / 다시 확인:</b> 말이 심하게 뭉개지거나, 문장에 없는 말이 나오거나, 소리가 깨집니다.</li>';
    $("review-instruction").textContent='끝까지 들으면 정상으로 표시됩니다. 목소리나 문장이 부자연스러우면 제외·다시 확인을 선택하고, 모두 확인한 뒤 결과를 저장하세요.';
  }else if(d.policy_review){
    $("policy").hidden=false;$("policy-text").textContent=d.policy_text;$("criteria").innerHTML='<li><b>정상:</b> 각 음원 아래 안내에 맞고 소리가 정상입니다.</li><li><b>제외 / 다시 확인:</b> 안내와 다르거나 소리가 깨지거나 판단이 어렵습니다.</li>';
    $("review-instruction").textContent='끝까지 들으면 정상으로 표시됩니다. 안내와 다르거나 소리가 깨지면 제외·다시 확인을 선택하고, 모두 확인한 뒤 결과를 저장하세요.';
  }
  d.items.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${r.text||r.group||'음원'}`;$("items").append(o);});
  try{const saved=JSON.parse(localStorage.getItem('koww:'+d.queue_sha256)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))decisions=saved;}catch(e){}
  $("items").disabled=false;$("start").disabled=false;
  show();
}).catch(e=>{$("saved").textContent='목록을 불러오지 못했습니다: '+e.message;});
function key(){return 'koww:'+data.queue_sha256;}
function remember(){localStorage.setItem(key(),JSON.stringify(decisions));}
function judged(row){const answer=decisions[row.id];return answer&&Object.hasOwn(labels,answer.decision)&&(answer.decision!=='keep'||answer.listened===true);}
function renderList(){
  if(!data)return;
  const list=$("listening-list"),pages=Math.max(1,Math.ceil(data.items.length/pageSize));
  listPage=Math.min(Math.max(0,listPage),pages-1);list.replaceChildren();
  data.items.slice(listPage*pageSize,(listPage+1)*pageSize).forEach((item,offset)=>{
    const position=listPage*pageSize+offset,row=document.createElement('button'),title=document.createElement('span'),badge=document.createElement('span');
    const answer=decisions[item.id],state=answer?.decision;
    row.type='button';row.className='voice-row';row.setAttribute('aria-current',String(position===index));
    title.className='listen-row-title';title.textContent=referenceReview||pilotReview?`목소리 ${position+1}`:item.text||item.group||`음원 ${position+1}`;
    badge.className='listen-badge';badge.textContent=judged(item)?labels[state]:answer?.listened===true?'청취':'미청취';badge.setAttribute('data-state',judged(item)?state:'unheard');
    row.setAttribute('data-number',String(position+1));row.setAttribute('aria-label',`${title.textContent} · ${badge.textContent}`);
    row.append(title,badge);row.onclick=()=>moveTo(position);list.append(row);
  });
  $("list-prev").disabled=listPage===0;$("list-next").disabled=listPage>=pages-1;$("list-position").textContent=`${listPage+1} / ${pages}`;
}
function renderProgress(){
  if(!data)return;
  const total=data.items.length,complete=data.items.filter(judged).length,recheck=data.items.filter(row=>decisions[row.id]?.decision==='review').length;
  $("review-progress").textContent=`판정한 음원 ${complete} / ${total}개 · 미판정 ${total-complete}개 · 다시 확인 ${recheck}개`;
}
function renderDecision(){const decision=decisions[data.items[index].id]?.decision;$("state").textContent=labels[decision]||'아직 듣지 않음';for(const value of ['keep','discard','review'])$(value).setAttribute('aria-pressed',String(decision===value));renderList();renderProgress();}
function show(){
  const r=data.items[index];if(!r)return;
  stop();playbackAllowed=true;
  $("title").textContent=`${index+1} / ${data.items.length}`;
  $("expected").textContent=(referenceReview?'샘플 문장: ':r.group?'확인할 소리: ':'기대 문장: ')+r.text;
  $("instruction").textContent=r.instruction||'';audio.src=r.audio;$("items").value=index;
  $("prev").disabled=index===0;$("next").disabled=index===data.items.length-1;listPage=Math.floor(index/pageSize);renderDecision();
}
function choose(decision){if(!data?.items[index])return;const id=data.items[index].id;decisions[id]={decision,listened:decisions[id]?.listened||false};remember();renderDecision();}
async function play(){
  if(!data?.items[index]||document.hidden)return;
  playbackAllowed=true;if(!audio.src)audio.src=data.items[index].audio;
  const version=++playbackVersion;
  try{await audio.play();}catch(e){if(version!==playbackVersion)return;stop();$("state").textContent='재생하지 못했습니다. 다시 눌러주세요.';}
}
audio.onplay=()=>{if(!playbackAllowed||document.hidden){stop(true);return;}started=true;setContinuous(true);};
audio.onpause=()=>{if(!audio.ended&&audio.paused){setContinuous(false);started=false;}};
audio.onerror=()=>{stop();$("state").textContent='재생하지 못했습니다. 다시 눌러주세요.';};
audio.onended=()=>{
  if(!audio.ended||!data?.items[index]||!started||!playbackAllowed||document.hidden)return;
  started=false;const id=data.items[index].id;
  decisions[id]={decision:decisions[id]?.decision||'keep',listened:true};remember();renderDecision();
  $("state").textContent='청취 완료 · '+labels[decisions[id].decision];
  if(continuous&&index+1<data.items.length){index++;show();setContinuous(true);play();}
  else if(continuous){setContinuous(false);$("state").textContent='전체 청취 완료 · 검수 결과 저장을 눌러주세요.';}
};
$("start").onclick=()=>{if(continuous||!audio.paused){stop();return;}setContinuous(true);return play();};$("pause").onclick=()=>stop();for(const d of ['keep','discard','review'])$(d).onclick=()=>choose(d);
function moveTo(value){if(!data||!Number.isInteger(value)||value<0||value>=data.items.length)return;const resume=continuous;index=value;show();if(resume){setContinuous(true);return play();}}
$("prev").onclick=()=>moveTo(index-1);$("next").onclick=()=>moveTo(index+1);$("items").onchange=()=>moveTo(Number($("items").value));
$("list-prev").onclick=()=>{listPage--;renderList();};$("list-next").onclick=()=>{listPage++;renderList();};
window.KowwListening?.enhance(audio,document.querySelector?.('.listen-controls'),{play:$("start"),previous:$("prev"),next:$("next")});
$("save").onclick=async()=>{if(!data)return;const pending=data.items.filter(r=>!judged(r));if(pending.length){$("saved").textContent=`아직 ${pending.length}개가 남았습니다. 미청취 항목은 보존 승인하지 않습니다.`;return;}if(data.policy_review&&!$("policy-approved").checked){$("saved").textContent='아래 자료 묶음 사용 동의에 체크한 뒤 저장하세요.';return;}$("save").disabled=true;$("saved").textContent='결과 저장 및 자료 확인 중…';try{const saveUrl=localUrl(config.save_url||'/save');const headers={'Content-Type':'application/json'};if(config.token)headers['X-Koww-Token']=config.token;const response=await fetch(saveUrl,{method:'POST',headers,body:JSON.stringify(data.policy_review?{decisions,policy_approved:$("policy-approved").checked}:decisions)});if(!response.ok)throw Error(await response.text());const result=await response.json();const hold=data.items.some(r=>decisions[r.id]?.decision==='review')||!data.items.some(r=>decisions[r.id]?.decision==='keep')||['content_exceptions_pending','pilot_exceptions_need_policy_fix','review_incomplete_or_policy_rejected'].includes(result.state);$("saved").textContent=hold?'판정을 저장했습니다. 다음 단계로 진행하기 전에 문제 항목을 확인하세요.':config.saved_message||'검수 결과를 저장했습니다.';}catch(e){$("saved").textContent='저장 실패 · '+e.message;}finally{$("save").disabled=false;}};
</script></html>
