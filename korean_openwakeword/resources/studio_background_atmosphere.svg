<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <filter id="atmosphere" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="3" seed="29" result="cloud"/>
    <feGaussianBlur in="cloud" stdDeviation="16" edgeMode="duplicate" result="haze"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch" result="grain"/>
    <feBlend in="haze" in2="grain" mode="soft-light"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1024" height="768" filter="url(#atmosphere)"/>
</svg>
