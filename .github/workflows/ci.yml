name: Library checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KOWW_CACHE_ROOT: ${{ github.workspace }}/.test-cache
      TMPDIR: ${{ github.workspace }}/.test-tmp
      TMP: ${{ github.workspace }}/.test-tmp
      TEMP: ${{ github.workspace }}/.test-tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary directories
        run: python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"
      - name: Install CPU test dependencies
        run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install library and pinned frontend implementation
        run: |
          python -m pip install ".[train,dev]"
          python -m pip install openwakeword==0.6.0 --no-deps
      - name: Portable contracts and actual small model training
        run: python -m pytest tests -m "not legacy_parity" -q --junitxml=test-results.xml
      - name: Microphone browser and PCM frame regression
        run: node tests/check_microphone_ui.cjs .test-tmp/microphone-ui.json
      - name: Build wheel and source archive
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            test-results.xml
            dist/*
            .test-tmp/microphone-ui.json
